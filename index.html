<script>
const P=["<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Embedded Fresher Quiz - Trang 4 (Tổng hợp Live Code)<\/title>\n<style>\n  * { box-sizing: border-box; }\n  body {\n    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n    background: #eef1f5;\n    margin: 0;\n    padding: 20px;\n    color: #1a1a1a;\n    line-height: 1.6;\n  }\n  .container { max-width: 1000px; margin: 0 auto; }\n  h1 {\n    text-align: center;\n    color: #1a237e;\n    border-bottom: 3px solid #1a237e;\n    padding-bottom: 10px;\n  }\n  .subtitle {\n    text-align: center;\n    color: #555;\n    margin-bottom: 20px;\n    font-style: italic;\n  }\n  .live-code {\n    background: #ffffff;\n    border-radius: 10px;\n    padding: 22px;\n    margin-bottom: 25px;\n    box-shadow: 0 3px 10px rgba(0,0,0,0.08);\n    border-left: 5px solid #1a237e;\n  }\n  .q-title {\n    font-weight: bold;\n    margin-bottom: 8px;\n    color: #1a237e;\n    font-size: 1.15em;\n  }\n  .source {\n    font-size: 0.85em;\n    color: #666;\n    margin-bottom: 12px;\n    font-style: italic;\n  }\n  .live-code p { margin: 10px 0; }\n\n  /* ==== CODE BLOCK — high contrast ==== */\n  pre {\n    margin: 0;\n    padding: 18px 20px;\n    border-radius: 8px;\n    overflow-x: auto;\n    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;\n    font-size: 0.92em;\n    line-height: 1.6;\n    tab-size: 4;\n  }\n  .code-solution {\n    background: #1e1e2e;      /* nền tối xanh đen */\n    color: #e6e6e6;           /* chữ sáng */\n    border: 1px solid #313244;\n  }\n  .code-solution .c-key   { color: #89dceb; font-weight: 600; } /* keyword: xanh cyan */\n  .code-solution .c-type  { color: #f9e2af; }                    /* type: vàng nhạt */\n  .code-solution .c-str   { color: #a6e3a1; }                    /* string: xanh lá */\n  .code-solution .c-num   { color: #fab387; }                    /* số: cam */\n  .code-solution .c-com   { color: #7f849c; font-style: italic; }/* comment: xám */\n  .code-solution .c-func  { color: #cba6f7; }                    /* hàm: tím */\n  .code-solution .c-pre   { color: #f38ba8; }                    /* preprocessor: hồng */\n\n  /* ==== BUTTONS ==== */\n  button {\n    background: #1a237e;\n    color: #fff;\n    border: none;\n    padding: 10px 22px;\n    border-radius: 6px;\n    cursor: pointer;\n    font-size: 1em;\n    margin-top: 12px;\n    margin-right: 8px;\n    transition: background 0.2s, transform 0.1s;\n    font-weight: 500;\n  }\n  button:hover { background: #283593; }\n  button:active { transform: scale(0.98); }\n\n  .btn-show-all {\n    display: block;\n    margin: 20px auto;\n    background: #2e7d32;\n    padding: 13px 34px;\n    font-size: 1.05em;\n  }\n  .btn-show-all:hover { background: #388e3c; }\n\n  /* ==== SOLUTION PANEL ==== */\n  .solution {\n    display: none;\n    margin-top: 18px;\n    padding: 20px;\n    background: #f1f8e9;\n    border-left: 5px solid #2e7d32;\n    border-radius: 6px;\n  }\n  .solution.show { display: block; }\n  .solution > strong {\n    display: block;\n    color: #1b5e20;\n    margin-bottom: 10px;\n    font-size: 1.05em;\n  }\n  .explain-block {\n    margin-top: 16px;\n    padding: 14px 18px;\n    background: #ffffff;\n    border-radius: 6px;\n    border-left: 4px solid #2e7d32;\n    color: #333;\n  }\n  .explain-block strong {\n    color: #1b5e20;\n    display: block;\n    margin-bottom: 6px;\n  }\n  .explain-block p { margin: 0; }\n\n  /* ==== NAV / TOC ==== */\n  .nav-links { text-align: center; margin: 30px 0; }\n  .nav-links a {\n    display: inline-block;\n    padding: 10px 24px;\n    background: #1a237e;\n    color: #fff;\n    text-decoration: none;\n    border-radius: 6px;\n    margin: 5px;\n    transition: background 0.2s;\n  }\n  .nav-links a:hover { background: #283593; }\n\n  .toc {\n    background: #fff;\n    padding: 22px;\n    border-radius: 10px;\n    box-shadow: 0 3px 10px rgba(0,0,0,0.08);\n    margin-bottom: 25px;\n  }\n  .toc h3 {\n    margin-top: 0;\n    color: #1a237e;\n    border-bottom: 2px solid #e0e0e0;\n    padding-bottom: 10px;\n  }\n  .toc ol { margin: 0; padding-left: 22px; }\n  .toc li { padding: 5px 0; }\n  .toc a {\n    color: #1a237e;\n    text-decoration: none;\n    font-weight: 500;\n  }\n  .toc a:hover { text-decoration: underline; }\n  .toc em { color: #888; font-size: 0.9em; }\n\n  /* inline code trong câu hỏi */\n  .inline-code {\n    background: #e8eaf6;\n    color: #c62828;\n    padding: 2px 7px;\n    border-radius: 4px;\n    font-family: 'Consolas', 'Monaco', monospace;\n    font-size: 0.9em;\n    font-weight: 600;\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"container\">\n  <h1>Embedded Fresher — Tổng hợp 15 bài Live Code<\/h1>\n  <p class=\"subtitle\">Trang 4 — Ôn tập tập trung phần live code (kèm đáp án &amp; giải thích chi tiết)<\/p>\n\n  <div class=\"toc\">\n    <h3>Mục lục 15 bài live code<\/h3>\n    <ol>\n      <li><a href=\"#bai1\">Đảo ngược chuỗi tại chỗ<\/a> <em>(Trang 1)<\/em><\/li>\n      <li><a href=\"#bai2\">Đếm số bit 1 (popcount)<\/a> <em>(Trang 1)<\/em><\/li>\n      <li><a href=\"#bai3\">Cấp phát mảng động và tính tổng<\/a> <em>(Trang 1)<\/em><\/li>\n      <li><a href=\"#bai4\">Set/clear/toggle/test bit<\/a> <em>(Trang 1)<\/em><\/li>\n      <li><a href=\"#bai5\">Tìm phần tử lớn thứ hai<\/a> <em>(Trang 1)<\/em><\/li>\n      <li><a href=\"#bai6\">Kiểm tra palindrome<\/a> <em>(Trang 2)<\/em><\/li>\n      <li><a href=\"#bai7\">Đảo bit 32-bit<\/a> <em>(Trang 2)<\/em><\/li>\n      <li><a href=\"#bai8\">Đếm từ trong chuỗi<\/a> <em>(Trang 2)<\/em><\/li>\n      <li><a href=\"#bai9\">Bubble sort tối ưu<\/a> <em>(Trang 2)<\/em><\/li>\n      <li><a href=\"#bai10\">Linked list đơn<\/a> <em>(Trang 2)<\/em><\/li>\n      <li><a href=\"#bai11\">GCD (Euclid)<\/a> <em>(Trang 3)<\/em><\/li>\n      <li><a href=\"#bai12\">Kiểm tra số nguyên tố<\/a> <em>(Trang 3)<\/em><\/li>\n      <li><a href=\"#bai13\">itoa — int sang chuỗi<\/a> <em>(Trang 3)<\/em><\/li>\n      <li><a href=\"#bai14\">Ký tự xuất hiện nhiều nhất<\/a> <em>(Trang 3)<\/em><\/li>\n      <li><a href=\"#bai15\">Ring buffer cho UART<\/a> <em>(Trang 3)<\/em><\/li>\n    <\/ol>\n  <\/div>\n\n  <button class=\"btn-show-all\" onclick=\"toggleAll()\" id=\"btn-all\">Hiển thị tất cả đáp án<\/button>\n\n  <div id=\"live-container\"><\/div>\n\n  <div class=\"nav-links\">\n    <a href=\"embedded-quiz-1.html\">← Trang 1<\/a>\n    <a href=\"embedded-quiz-2.html\">← Trang 2<\/a>\n    <a href=\"embedded-quiz-3.html\">← Trang 3<\/a>\n  <\/div>\n<\/div>\n\n<script>\n// ============================================================\n// DỮ LIỆU 15 BÀI LIVE CODE TỔNG HỢP\n// ============================================================\nconst liveCodes = [\n// ---------- TRANG 1 ----------\n{\n  id: \"bai1\",\n  title: \"Bài 1: Đảo ngược chuỗi tại chỗ (in-place)\",\n  source: \"Trang 1\",\n  desc: 'Viết hàm <span class=\"inline-code\">void reverse_string(char *str)<\/span> đảo ngược chuỗi ký tự tại chỗ (không dùng mảng phụ). Ví dụ: \"hello\" → \"olleh\".',\n  solution: `#include <stdio.h>\n#include <string.h>\n\nvoid reverse_string(char *str) {\n    if (str == NULL) return;\n    int left = 0;\n    int right = strlen(str) - 1;\n    while (left < right) {\n        char temp = str[left];\n        str[left] = str[right];\n        str[right] = temp;\n        left++;\n        right--;\n    }\n}\n\nint main() {\n    char s[] = \"hello\";\n    reverse_string(s);\n    printf(\"%s\\\\n\", s);  // olleh\n    return 0;\n}`,\n  explain: `- Kiểm tra NULL để tránh crash.\n- Dùng hai chỉ số left và right, hoán đổi từng cặp ký tự.\n- Độ phức tạp O(n), không dùng bộ nhớ phụ.\n- Lưu ý: truyền char s[] (mảng) chứ không phải char *s = \"hello\" (string literal read-only).`\n},\n{\n  id: \"bai2\",\n  title: \"Bài 2: Đếm số bit 1 trong một số nguyên (popcount)\",\n  source: \"Trang 1\",\n  desc: 'Viết hàm <span class=\"inline-code\">int count_bits(unsigned int n)<\/span> đếm số bit 1 trong biểu diễn nhị phân của n.',\n  solution: `#include <stdio.h>\n\nint count_bits(unsigned int n) {\n    int count = 0;\n    while (n) {\n        count += n & 1;  // kiểm tra bit LSB\n        n >>= 1;         // dịch phải 1 bit\n    }\n    return count;\n}\n\n// Hoặc dùng thuật toán Brian Kernighan:\nint count_bits_fast(unsigned int n) {\n    int count = 0;\n    while (n) {\n        n &= (n - 1);  // xóa bit 1 thấp nhất\n        count++;\n    }\n    return count;\n}\n\nint main() {\n    printf(\"%d\\\\n\", count_bits(0b1011));      // 3\n    printf(\"%d\\\\n\", count_bits_fast(0b1011)); // 3\n    return 0;\n}`,\n  explain: `- Cách 1: duyệt từng bit, kiểm tra LSB bằng n & 1, dịch phải.\n- Cách 2 (Kernighan): n &= (n-1) xóa bit 1 thấp nhất, lặp đến khi n=0. Số vòng lặp = số bit 1.\n- Cả hai đều đúng; cách 2 nhanh hơn với số ít bit 1.`\n},\n{\n  id: \"bai3\",\n  title: \"Bài 3: Cấp phát mảng động và tính tổng\",\n  source: \"Trang 1\",\n  desc: \"Viết chương trình nhập n, cấp phát động mảng n số nguyên, nhập giá trị, tính tổng và giải phóng bộ nhớ.\",\n  solution: `#include <stdio.h>\n#include <stdlib.h>\n\nint main() {\n    int n;\n    printf(\"Nhap n: \");\n    scanf(\"%d\", &n);\n\n    if (n <= 0) {\n        printf(\"n phai > 0\\\\n\");\n        return 1;\n    }\n\n    int *arr = (int*)malloc(n * sizeof(int));\n    if (arr == NULL) {\n        printf(\"Cap phat bo nho that bai\\\\n\");\n        return 1;\n    }\n\n    for (int i = 0; i < n; i++) {\n        printf(\"arr[%d] = \", i);\n        scanf(\"%d\", &arr[i]);\n    }\n\n    long sum = 0;\n    for (int i = 0; i < n; i++) {\n        sum += arr[i];\n    }\n    printf(\"Tong = %ld\\\\n\", sum);\n\n    free(arr);       // giải phóng\n    arr = NULL;      // tránh dangling pointer\n    return 0;\n}`,\n  explain: `- Luôn kiểm tra malloc trả NULL.\n- Dùng long cho sum để tránh tràn int.\n- free(arr) sau khi dùng xong, gán NULL để tránh dangling.\n- Không quên include stdlib.h.`\n},\n{\n  id: \"bai4\",\n  title: \"Bài 4: Hàm set/clear/toggle bit\",\n  source: \"Trang 1\",\n  desc: 'Viết các macro hoặc hàm để set, clear, toggle và test bit thứ n của một biến <span class=\"inline-code\">uint32_t reg<\/span>.',\n  solution: `#include <stdio.h>\n#include <stdint.h>\n\n#define SET_BIT(reg, n)    ((reg) |= (1U << (n)))\n#define CLEAR_BIT(reg, n)  ((reg) &= ~(1U << (n)))\n#define TOGGLE_BIT(reg, n) ((reg) ^= (1U << (n)))\n#define TEST_BIT(reg, n)   (((reg) >> (n)) & 1U)\n\nint main() {\n    uint32_t reg = 0;\n\n    SET_BIT(reg, 3);        // reg = 0b1000\n    printf(\"0x%X\\\\n\", reg);  // 0x8\n\n    SET_BIT(reg, 0);        // reg = 0b1001\n    printf(\"0x%X\\\\n\", reg);  // 0x9\n\n    CLEAR_BIT(reg, 3);      // reg = 0b0001\n    printf(\"0x%X\\\\n\", reg);  // 0x1\n\n    TOGGLE_BIT(reg, 0);     // reg = 0\n    printf(\"0x%X\\\\n\", reg);  // 0x0\n\n    SET_BIT(reg, 5);\n    printf(\"Bit 5 = %d\\\\n\", TEST_BIT(reg, 5)); // 1\n    printf(\"Bit 4 = %d\\\\n\", TEST_BIT(reg, 4)); // 0\n\n    return 0;\n}`,\n  explain: `- SET: OR với mask 1<<n.\n- CLEAR: AND với ~(1<<n).\n- TOGGLE: XOR với 1<<n.\n- TEST: dịch phải n rồi AND 1.\n- Dùng 1U để tránh signed shift.`\n},\n{\n  id: \"bai5\",\n  title: \"Bài 5: Tìm phần tử lớn thứ hai trong mảng\",\n  source: \"Trang 1\",\n  desc: 'Viết hàm <span class=\"inline-code\">int second_largest(int *arr, int n)<\/span> trả về phần tử lớn thứ hai trong mảng (các phần tử có thể trùng nhau). Nếu không có, trả về -1.',\n  solution: `#include <stdio.h>\n#include <limits.h>\n\nint second_largest(int *arr, int n) {\n    if (arr == NULL || n < 2) return -1;\n\n    int first = INT_MIN;\n    int second = INT_MIN;\n\n    for (int i = 0; i < n; i++) {\n        if (arr[i] > first) {\n            second = first;\n            first = arr[i];\n        } else if (arr[i] > second && arr[i] != first) {\n            second = arr[i];\n        }\n    }\n\n    if (second == INT_MIN) return -1;\n    return second;\n}\n\nint main() {\n    int a[] = {12, 35, 1, 10, 34, 1};\n    printf(\"%d\\\\n\", second_largest(a, 6)); // 34\n\n    int b[] = {10, 10, 10};\n    printf(\"%d\\\\n\", second_largest(b, 3)); // -1\n\n    int c[] = {5, 3};\n    printf(\"%d\\\\n\", second_largest(c, 2)); // 3\n\n    return 0;\n}`,\n  explain: `- Duyệt một lần, giữ first (lớn nhất) và second (lớn thứ hai).\n- Nếu arr[i] > first: second = first, first = arr[i].\n- Ngược lại nếu arr[i] > second và arr[i] != first: cập nhật second.\n- Xử lý trường hợp toàn phần tử bằng nhau → second vẫn INT_MIN → trả -1.\n- Độ phức tạp O(n).`\n},\n// ---------- TRANG 2 ----------\n{\n  id: \"bai6\",\n  title: \"Bài 6: Kiểm tra chuỗi palindrome\",\n  source: \"Trang 2\",\n  desc: 'Viết hàm <span class=\"inline-code\">int is_palindrome(const char *str)<\/span> kiểm tra chuỗi có phải palindrome không (đọc xuôi ngược giống nhau). Trả 1 nếu đúng, 0 nếu sai.',\n  solution: `#include <stdio.h>\n#include <string.h>\n\nint is_palindrome(const char *str) {\n    if (str == NULL) return 0;\n    int left = 0;\n    int right = strlen(str) - 1;\n    while (left < right) {\n        if (str[left] != str[right]) return 0;\n        left++;\n        right--;\n    }\n    return 1;\n}\n\nint main() {\n    printf(\"%d\\\\n\", is_palindrome(\"radar\"));  // 1\n    printf(\"%d\\\\n\", is_palindrome(\"hello\"));  // 0\n    printf(\"%d\\\\n\", is_palindrome(\"abba\"));   // 1\n    printf(\"%d\\\\n\", is_palindrome(\"\"));       // 1\n    return 0;\n}`,\n  explain: `- Dùng 2 con trỏ left/right tiến vào giữa.\n- Nếu ký tự khác nhau → không phải palindrome.\n- Chuỗi rỗng hoặc 1 ký tự → palindrome.\n- Độ phức tạp O(n), không dùng bộ nhớ phụ.`\n},\n{\n  id: \"bai7\",\n  title: \"Bài 7: Đảo bit của một số 32-bit\",\n  source: \"Trang 2\",\n  desc: 'Viết hàm <span class=\"inline-code\">uint32_t reverse_bits(uint32_t n)<\/span> đảo ngược thứ tự tất cả 32 bit của n.',\n  solution: `#include <stdio.h>\n#include <stdint.h>\n\nuint32_t reverse_bits(uint32_t n) {\n    uint32_t result = 0;\n    for (int i = 0; i < 32; i++) {\n        result <<= 1;           // dịch trái result\n        result |= (n & 1);      // lấy bit LSB của n\n        n >>= 1;                // dịch phải n\n    }\n    return result;\n}\n\n// Cách tối ưu (bit hack):\nuint32_t reverse_bits_fast(uint32_t n) {\n    n = ((n >> 1) & 0x55555555) | ((n & 0x55555555) << 1);\n    n = ((n >> 2) & 0x33333333) | ((n & 0x33333333) << 2);\n    n = ((n >> 4) & 0x0F0F0F0F) | ((n & 0x0F0F0F0F) << 4);\n    n = ((n >> 8) & 0x00FF00FF) | ((n & 0x00FF00FF) << 8);\n    n = (n >> 16) | (n << 16);\n    return n;\n}\n\nint main() {\n    printf(\"0x%X\\\\n\", reverse_bits(0x1));        // 0x80000000\n    printf(\"0x%X\\\\n\", reverse_bits_fast(0x1));   // 0x80000000\n    return 0;\n}`,\n  explain: `- Cách 1: lặp 32 lần, mỗi lần lấy LSB của n đẩy vào result.\n- Cách 2: chia để trị, đảo từng cặp bit, rồi nhóm 2, 4, 8, 16 bit.\n- Cả hai đúng; cách 2 nhanh hơn (O(log n) thao tác).`\n},\n{\n  id: \"bai8\",\n  title: \"Bài 8: Tách và đếm từ trong chuỗi\",\n  source: \"Trang 2\",\n  desc: \"Viết hàm đếm số từ trong chuỗi (các từ cách nhau bởi space, tab, newline).\",\n  solution: `#include <stdio.h>\n#include <ctype.h>\n\nint count_words(const char *str) {\n    if (str == NULL) return 0;\n    int count = 0;\n    int in_word = 0;\n\n    while (*str) {\n        if (isspace((unsigned char)*str)) {\n            in_word = 0;\n        } else if (!in_word) {\n            in_word = 1;\n            count++;\n        }\n        str++;\n    }\n    return count;\n}\n\nint main() {\n    printf(\"%d\\\\n\", count_words(\"hello world\"));       // 2\n    printf(\"%d\\\\n\", count_words(\"  a  b   c  \"));      // 3\n    printf(\"%d\\\\n\", count_words(\"\"));                   // 0\n    printf(\"%d\\\\n\", count_words(\"one\"));               // 1\n    return 0;\n}`,\n  explain: `- Dùng flag in_word để biết đang trong từ hay không.\n- Gặp whitespace: in_word = 0.\n- Gặp ký tự thường và in_word = 0: bắt đầu từ mới → count++.\n- isspace() cần ép (unsigned char) để tránh UB với ký tự âm.`\n},\n{\n  id: \"bai9\",\n  title: \"Bài 9: Sắp xếp mảng bằng bubble sort\",\n  source: \"Trang 2\",\n  desc: 'Viết hàm <span class=\"inline-code\">void bubble_sort(int *arr, int n)<\/span> sắp xếp mảng tăng dần. Tối ưu dừng sớm nếu mảng đã sorted.',\n  solution: `#include <stdio.h>\n\nvoid bubble_sort(int *arr, int n) {\n    if (arr == NULL || n < 2) return;\n    for (int i = 0; i < n - 1; i++) {\n        int swapped = 0;\n        for (int j = 0; j < n - 1 - i; j++) {\n            if (arr[j] > arr[j+1]) {\n                int temp = arr[j];\n                arr[j] = arr[j+1];\n                arr[j+1] = temp;\n                swapped = 1;\n            }\n        }\n        if (!swapped) break;  // đã sorted, dừng sớm\n    }\n}\n\nint main() {\n    int a[] = {5, 1, 4, 2, 8};\n    bubble_sort(a, 5);\n    for (int i = 0; i < 5; i++) printf(\"%d \", a[i]);\n    printf(\"\\\\n\");  // 1 2 4 5 8\n    return 0;\n}`,\n  explain: `- Bubble sort: so sánh cặp kề, đổi chỗ nếu sai thứ tự.\n- Sau vòng i, i phần tử cuối đã đúng vị trí → giảm biên.\n- Nếu 1 vòng không có swap → mảng đã sorted, dừng sớm → best case O(n).\n- Worst case O(n²).`\n},\n{\n  id: \"bai10\",\n  title: \"Bài 10: Cấu trúc dữ liệu linked list đơn giản\",\n  source: \"Trang 2\",\n  desc: \"Cài đặt linked list đơn với các thao tác: thêm đầu (push), in danh sách, và giải phóng toàn bộ.\",\n  solution: `#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node {\n    int data;\n    struct Node *next;\n} Node;\n\nvoid push(Node **head, int value) {\n    Node *new_node = (Node*)malloc(sizeof(Node));\n    if (new_node == NULL) return;\n    new_node->data = value;\n    new_node->next = *head;\n    *head = new_node;\n}\n\nvoid print_list(Node *head) {\n    while (head != NULL) {\n        printf(\"%d -> \", head->data);\n        head = head->next;\n    }\n    printf(\"NULL\\\\n\");\n}\n\nvoid free_list(Node **head) {\n    Node *current = *head;\n    while (current != NULL) {\n        Node *next = current->next;\n        free(current);\n        current = next;\n    }\n    *head = NULL;\n}\n\nint main() {\n    Node *head = NULL;\n    push(&head, 10);\n    push(&head, 20);\n    push(&head, 30);\n    print_list(head);   // 30 -> 20 -> 10 -> NULL\n    free_list(&head);\n    return 0;\n}`,\n  explain: `- push dùng Node** để cập nhật head (vì cần đổi con trỏ head).\n- print_list duyệt đến NULL.\n- free_list lưu next trước khi free để tránh dùng after free.\n- Sau free, gán *head = NULL để tránh dangling.\n- Kiểm tra malloc trả NULL.`\n},\n// ---------- TRANG 3 ----------\n{\n  id: \"bai11\",\n  title: \"Bài 11: Tìm ước chung lớn nhất (GCD)\",\n  source: \"Trang 3\",\n  desc: 'Viết hàm <span class=\"inline-code\">int gcd(int a, int b)<\/span> dùng thuật toán Euclid để tìm ước chung lớn nhất của a và b.',\n  solution: `#include <stdio.h>\n\n// Đệ quy\nint gcd(int a, int b) {\n    if (b == 0) return a;\n    return gcd(b, a % b);\n}\n\n// Không đệ quy (an toàn hơn cho embedded)\nint gcd_iter(int a, int b) {\n    while (b != 0) {\n        int temp = b;\n        b = a % b;\n        a = temp;\n    }\n    return a;\n}\n\nint main() {\n    printf(\"%d\\\\n\", gcd(48, 18));       // 6\n    printf(\"%d\\\\n\", gcd_iter(100, 75)); // 25\n    printf(\"%d\\\\n\", gcd(7, 13));        // 1\n    return 0;\n}`,\n  explain: `- Thuật toán Euclid: gcd(a,b) = gcd(b, a mod b) đến khi b=0.\n- Bản đệ quy ngắn gọn nhưng tốn stack; bản lặp an toàn hơn cho embedded.\n- Không xử lý số âm; nếu cần, dùng abs() trước.`\n},\n{\n  id: \"bai12\",\n  title: \"Bài 12: Kiểm tra số nguyên tố\",\n  source: \"Trang 3\",\n  desc: 'Viết hàm <span class=\"inline-code\">int is_prime(int n)<\/span> kiểm tra n có phải số nguyên tố. Tối ưu bằng cách chỉ kiểm tra đến sqrt(n).',\n  solution: `#include <stdio.h>\n#include <math.h>\n\nint is_prime(int n) {\n    if (n < 2) return 0;\n    if (n < 4) return 1;      // 2, 3\n    if (n % 2 == 0) return 0; // chẵn\n    for (int i = 3; i * i <= n; i += 2) {\n        if (n % i == 0) return 0;\n    }\n    return 1;\n}\n\nint main() {\n    printf(\"%d\\\\n\", is_prime(2));   // 1\n    printf(\"%d\\\\n\", is_prime(17));  // 1\n    printf(\"%d\\\\n\", is_prime(18));  // 0\n    printf(\"%d\\\\n\", is_prime(1));   // 0\n    printf(\"%d\\\\n\", is_prime(97));  // 1\n    return 0;\n}`,\n  explain: `- n<2 không phải nguyên tố.\n- Kiểm tra 2, 3 nhanh.\n- Loại số chẵn, chỉ kiểm tra ước lẻ từ 3 đến sqrt(n).\n- Dùng i*i <= n thay vì sqrt() để tránh dùng math.h và float.\n- Độ phức tạp O(sqrt(n)).`\n},\n{\n  id: \"bai13\",\n  title: \"Bài 13: Chuyển số nguyên sang chuỗi (itoa)\",\n  source: \"Trang 3\",\n  desc: 'Viết hàm <span class=\"inline-code\">void int_to_str(int n, char *buf)<\/span> chuyển số nguyên n thành chuỗi ký tự (hỗ trợ số âm).',\n  solution: `#include <stdio.h>\n#include <string.h>\n\nvoid reverse(char *s, int len) {\n    for (int i = 0, j = len - 1; i < j; i++, j--) {\n        char t = s[i]; s[i] = s[j]; s[j] = t;\n    }\n}\n\nvoid int_to_str(int n, char *buf) {\n    int i = 0;\n    int is_negative = 0;\n    unsigned int num;\n\n    if (n < 0) {\n        is_negative = 1;\n        num = (unsigned int)(-n);\n    } else {\n        num = (unsigned int)n;\n    }\n\n    if (num == 0) {\n        buf[i++] = '0';\n    } else {\n        while (num > 0) {\n            buf[i++] = '0' + (num % 10);\n            num /= 10;\n        }\n    }\n\n    if (is_negative) buf[i++] = '-';\n    buf[i] = '\\\\0';\n    reverse(buf, i);\n}\n\nint main() {\n    char buf[32];\n    int_to_str(-12345, buf);\n    printf(\"%s\\\\n\", buf);  // -12345\n    int_to_str(0, buf);\n    printf(\"%s\\\\n\", buf);  // 0\n    int_to_str(2147483647, buf);\n    printf(\"%s\\\\n\", buf);  // 2147483647\n    return 0;\n}`,\n  explain: `- Lấy từng chữ số bằng % 10, lưu ngược vào buffer.\n- Xử lý số âm: đánh dấu và chuyển sang unsigned để tránh tràn INT_MIN.\n- Số 0 đặc biệt: buffer = \"0\".\n- Đảo chuỗi cuối cùng.\n- Đảm bảo buffer đủ lớn (32 byte an toàn cho int 32-bit).`\n},\n{\n  id: \"bai14\",\n  title: \"Bài 14: Đếm ký tự xuất hiện nhiều nhất trong chuỗi\",\n  source: \"Trang 3\",\n  desc: 'Viết hàm <span class=\"inline-code\">char most_frequent_char(const char *str)<\/span> trả về ký tự xuất hiện nhiều nhất (chỉ xét chữ cái thường).',\n  solution: `#include <stdio.h>\n#include <string.h>\n\nchar most_frequent_char(const char *str) {\n    if (str == NULL) return '\\\\0';\n    int count[256] = {0};\n    int max_count = 0;\n    char result = '\\\\0';\n\n    for (int i = 0; str[i] != '\\\\0'; i++) {\n        unsigned char c = (unsigned char)str[i];\n        count[c]++;\n    }\n\n    for (int i = 0; str[i] != '\\\\0'; i++) {\n        unsigned char c = (unsigned char)str[i];\n        if (count[c] > max_count) {\n            max_count = count[c];\n            result = str[i];\n        }\n    }\n    return result;\n}\n\nint main() {\n    printf(\"%c\\\\n\", most_frequent_char(\"hello world\"));  // l\n    printf(\"%c\\\\n\", most_frequent_char(\"aabbcc\"));       // a (first max)\n    printf(\"%c\\\\n\", most_frequent_char(\"\"));             // \\\\0\n    return 0;\n}`,\n  explain: `- Dùng mảng count[256] đếm tần suất từng ký tự (bao gồm cả ký tự đặc biệt).\n- Duyệt lần 2 để tìm ký tự có count lớn nhất, giữ ký tự xuất hiện đầu tiên khi hòa.\n- Ép (unsigned char) để tránh index âm.\n- Độ phức tạp O(n).`\n},\n{\n  id: \"bai15\",\n  title: \"Bài 15: Cấu trúc ring buffer (circular buffer) cho UART\",\n  source: \"Trang 3\",\n  desc: \"Cài đặt ring buffer đơn giản với các thao tác: init, put (ghi), get (đọc), dùng cho UART RX/TX trong embedded.\",\n  solution: `#include <stdio.h>\n#include <stdint.h>\n#include <stdbool.h>\n\n#define RING_SIZE 8\n\ntypedef struct {\n    uint8_t buffer[RING_SIZE];\n    volatile uint16_t head;   // nơi ghi\n    volatile uint16_t tail;   // nơi đọc\n} RingBuffer;\n\nvoid ring_init(RingBuffer *rb) {\n    rb->head = 0;\n    rb->tail = 0;\n}\n\nbool ring_is_empty(RingBuffer *rb) {\n    return rb->head == rb->tail;\n}\n\nbool ring_is_full(RingBuffer *rb) {\n    return ((rb->head + 1) % RING_SIZE) == rb->tail;\n}\n\nbool ring_put(RingBuffer *rb, uint8_t data) {\n    uint16_t next = (rb->head + 1) % RING_SIZE;\n    if (next == rb->tail) return false;  // full\n    rb->buffer[rb->head] = data;\n    rb->head = next;\n    return true;\n}\n\nbool ring_get(RingBuffer *rb, uint8_t *data) {\n    if (rb->head == rb->tail) return false;  // empty\n    *data = rb->buffer[rb->tail];\n    rb->tail = (rb->tail + 1) % RING_SIZE;\n    return true;\n}\n\nint main() {\n    RingBuffer rb;\n    ring_init(&rb);\n\n    // Ghi 7 phần tử (chừa 1 slot để phân biệt full/empty)\n    for (uint8_t i = 1; i <= 7; i++) {\n        ring_put(&rb, i);\n    }\n    printf(\"Full? %d\\\\n\", ring_is_full(&rb));  // 1\n    printf(\"Put 8: %d\\\\n\", ring_put(&rb, 8));  // 0 (thất bại)\n\n    uint8_t val;\n    while (ring_get(&rb, &val)) {\n        printf(\"%d \", val);  // 1 2 3 4 5 6 7\n    }\n    printf(\"\\\\nEmpty? %d\\\\n\", ring_is_empty(&rb));  // 1\n    return 0;\n}`,\n  explain: `- Ring buffer dùng head (ghi) và tail (đọc), wrap-around bằng % RING_SIZE.\n- Điều kiện full: (head+1) % SIZE == tail → chừa 1 slot để phân biệt full/empty.\n- Điều kiện empty: head == tail.\n- head/tail nên volatile nếu dùng trong ISR (UART RX ISR ghi, main loop đọc).\n- Thao tác put/get O(1), không dùng malloc → an toàn cho embedded.`\n}\n];\n\n// ============================================================\n// SYNTAX HIGHLIGHTING ĐƠN GIẢN\n// ============================================================\nfunction highlightC(code) {\n  // Escape HTML trước\n  let s = code\n    .replace(/&/g, '&amp;')\n    .replace(/<\/g, '&lt;')\n    .replace(/>/g, '&gt;');\n\n  // Bảo vệ string và comment bằng placeholder\n  const placeholders = [];\n  let phIndex = 0;\n\n  // 1. Comments (// và /* */)\n  s = s.replace(/\\/\\/[^\\n]*/g, (m) => {\n    placeholders.push(`<span class=\"c-com\">${m}<\/span>`);\n    return `\\u0000${phIndex++}\\u0000`;\n  });\n  s = s.replace(/\\/\\*[\\s\\S]*?\\*\\//g, (m) => {\n    placeholders.push(`<span class=\"c-com\">${m}<\/span>`);\n    return `\\u0000${phIndex++}\\u0000`;\n  });\n\n  // 2. Strings\n  s = s.replace(/\"(?:\\\\.|[^\"\\\\])*\"/g, (m) => {\n    placeholders.push(`<span class=\"c-str\">${m}<\/span>`);\n    return `\\u0000${phIndex++}\\u0000`;\n  });\n  s = s.replace(/'(?:\\\\.|[^'\\\\])*'/g, (m) => {\n    placeholders.push(`<span class=\"c-str\">${m}<\/span>`);\n    return `\\u0000${phIndex++}\\u0000`;\n  });\n\n  // 3. Preprocessor (#include, #define)\n  s = s.replace(/^(\\s*)(#\\w+)/gm, (m, sp, dir) => {\n    return `${sp}<span class=\"c-pre\">${dir}<\/span>`;\n  });\n\n  // 4. Keywords\n  const keywords = ['int','char','void','long','short','unsigned','signed','float','double',\n    'if','else','for','while','do','switch','case','break','continue','return','goto',\n    'struct','union','enum','typedef','sizeof','const','static','extern','volatile','register',\n    'inline','NULL','true','false','bool','uint8_t','uint16_t','uint32_t','int8_t','int16_t','int32_t'];\n  keywords.forEach(kw => {\n    const re = new RegExp(`\\\\b${kw}\\\\b`, 'g');\n    s = s.replace(re, `<span class=\"c-key\">${kw}<\/span>`);\n  });\n\n  // 5. Numbers\n  s = s.replace(/\\b(0x[0-9A-Fa-f]+|\\d+)\\b/g, '<span class=\"c-num\">$1<\/span>');\n\n  // 6. Restore placeholders\n  s = s.replace(/\\u0000(\\d+)\\u0000/g, (m, i) => placeholders[parseInt(i)]);\n\n  return s;\n}\n\n// ============================================================\n// RENDER LIVE CODE\n// ============================================================\nconst liveContainer = document.getElementById('live-container');\n\nliveCodes.forEach((item, idx) => {\n  const div = document.createElement('div');\n  div.className = 'live-code';\n  div.id = item.id;\n  div.innerHTML = `\n    <div class=\"q-title\">${item.title}<\/div>\n    <div class=\"source\">📄 Nguồn: ${item.source}<\/div>\n    <p>${item.desc}<\/p>\n    <button onclick=\"toggleSolution(${idx})\">Hiển thị đáp án<\/button>\n    <div class=\"solution\" id=\"sol-${idx}\">\n      <strong>Lời giải:<\/strong>\n      <pre class=\"code-solution\"><code>${highlightC(item.solution)}<\/code><\/pre>\n      <div class=\"explain-block\">\n        <strong>Giải thích chi tiết:<\/strong>\n        <p>${item.explain}<\/p>\n      <\/div>\n    <\/div>\n  `;\n  liveContainer.appendChild(div);\n});\n\nfunction toggleSolution(idx) {\n  const sol = document.getElementById(`sol-${idx}`);\n  const btn = sol.previousElementSibling;\n  if (sol.classList.contains('show')) {\n    sol.classList.remove('show');\n    btn.textContent = 'Hiển thị đáp án';\n  } else {\n    sol.classList.add('show');\n    btn.textContent = 'Ẩn đáp án';\n  }\n}\n\n// Nút hiển thị/ẩn tất cả\nlet allShown = false;\nfunction toggleAll() {\n  allShown = !allShown;\n  const btn = document.getElementById('btn-all');\n  liveCodes.forEach((item, idx) => {\n    const sol = document.getElementById(`sol-${idx}`);\n    const toggleBtn = sol.previousElementSibling;\n    if (allShown) {\n      sol.classList.add('show');\n      toggleBtn.textContent = 'Ẩn đáp án';\n    } else {\n      sol.classList.remove('show');\n      toggleBtn.textContent = 'Hiển thị đáp án';\n    }\n  });\n  btn.textContent = allShown ? 'Ẩn tất cả đáp án' : 'Hiển thị tất cả đáp án';\n}\n<\/script>\n<style>.nav-links{display:none!important}<\/style><script>document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\")||\"\";e.preventDefault();if(h.charAt(0)!==\"#\")return;var id=decodeURIComponent(h.slice(1)),t=id&&(document.getElementById(id)||document.getElementsByName(id)[0]);if(t)t.scrollIntoView({behavior:\"smooth\"});else window.scrollTo({top:0,behavior:\"smooth\"})});<\/script><\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Embedded Fresher - Trang 6 (DS&amp;A nâng cao + RTOS)<\/title>\n<style>\n  * { box-sizing: border-box; }\n  body {\n    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n    background: #eef1f5;\n    margin: 0;\n    padding: 20px;\n    color: #1a1a1a;\n    line-height: 1.6;\n  }\n  .container { max-width: 1000px; margin: 0 auto; }\n  h1 {\n    text-align: center;\n    color: #1a237e;\n    border-bottom: 3px solid #1a237e;\n    padding-bottom: 10px;\n  }\n  h2 {\n    background: #1a237e;\n    color: #fff;\n    padding: 12px 18px;\n    border-radius: 8px;\n    margin-top: 40px;\n    font-size: 1.2em;\n  }\n  h2.rtos { background: #b71c1c; }\n  .subtitle {\n    text-align: center;\n    color: #555;\n    margin-bottom: 20px;\n    font-style: italic;\n  }\n  .stats { text-align: center; margin-bottom: 20px; }\n  .badge {\n    display: inline-block;\n    padding: 4px 12px;\n    border-radius: 12px;\n    font-size: 0.85em;\n    font-weight: 600;\n    margin: 0 4px;\n  }\n  .badge.easy { background: #d4edda; color: #155724; }\n  .badge.medium { background: #fff3cd; color: #856404; }\n  .badge.hard { background: #f8d7da; color: #721c24; }\n  .badge.rtos-tag { background: #ffcdd2; color: #b71c1c; }\n\n  .live-code {\n    background: #ffffff;\n    border-radius: 10px;\n    padding: 22px;\n    margin-bottom: 25px;\n    box-shadow: 0 3px 10px rgba(0,0,0,0.08);\n    border-left: 5px solid #1a237e;\n  }\n  .live-code.rtos-card { border-left-color: #b71c1c; }\n  .q-title {\n    font-weight: bold;\n    margin-bottom: 8px;\n    color: #1a237e;\n    font-size: 1.15em;\n    display: flex;\n    align-items: center;\n    flex-wrap: wrap;\n    gap: 8px;\n  }\n  .rtos-card .q-title { color: #b71c1c; }\n  .q-title .num {\n    background: #1a237e;\n    color: #fff;\n    width: 32px;\n    height: 32px;\n    border-radius: 50%;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 0.9em;\n    flex-shrink: 0;\n  }\n  .rtos-card .q-title .num { background: #b71c1c; }\n  .live-code p { margin: 10px 0; }\n\n  .example-box {\n    background: #f5f7fa;\n    border-left: 4px solid #78909c;\n    padding: 10px 14px;\n    margin: 10px 0;\n    border-radius: 4px;\n    font-family: 'Consolas', 'Monaco', monospace;\n    font-size: 0.9em;\n  }\n  .example-box strong { color: #37474f; }\n\n  pre {\n    margin: 0;\n    padding: 18px 20px;\n    border-radius: 8px;\n    overflow-x: auto;\n    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;\n    font-size: 0.92em;\n    line-height: 1.6;\n    tab-size: 4;\n  }\n  .code-solution {\n    background: #1e1e2e;\n    color: #e6e6e6;\n    border: 1px solid #313244;\n  }\n  .code-solution .c-key   { color: #89dceb; font-weight: 600; }\n  .code-solution .c-type  { color: #f9e2af; }\n  .code-solution .c-str   { color: #a6e3a1; }\n  .code-solution .c-num   { color: #fab387; }\n  .code-solution .c-com   { color: #7f849c; font-style: italic; }\n  .code-solution .c-pre   { color: #f38ba8; }\n\n  button {\n    background: #1a237e;\n    color: #fff;\n    border: none;\n    padding: 10px 22px;\n    border-radius: 6px;\n    cursor: pointer;\n    font-size: 1em;\n    margin-top: 12px;\n    margin-right: 8px;\n    transition: background 0.2s, transform 0.1s;\n    font-weight: 500;\n  }\n  button:hover { background: #283593; }\n  button:active { transform: scale(0.98); }\n  .rtos-card button { background: #b71c1c; }\n  .rtos-card button:hover { background: #c62828; }\n\n  .btn-show-all {\n    display: block;\n    margin: 20px auto;\n    background: #2e7d32;\n    padding: 13px 34px;\n    font-size: 1.05em;\n  }\n  .btn-show-all:hover { background: #388e3c; }\n\n  .solution {\n    display: none;\n    margin-top: 18px;\n    padding: 20px;\n    background: #f1f8e9;\n    border-left: 5px solid #2e7d32;\n    border-radius: 6px;\n  }\n  .solution.show { display: block; }\n  .solution > strong {\n    display: block;\n    color: #1b5e20;\n    margin-bottom: 10px;\n    font-size: 1.05em;\n  }\n  .explain-block {\n    margin-top: 16px;\n    padding: 14px 18px;\n    background: #ffffff;\n    border-radius: 6px;\n    border-left: 4px solid #2e7d32;\n    color: #333;\n  }\n  .explain-block strong {\n    color: #1b5e20;\n    display: block;\n    margin-bottom: 6px;\n  }\n  .explain-block p { margin: 0 0 8px 0; }\n  .complexity {\n    display: inline-block;\n    background: #e8eaf6;\n    color: #1a237e;\n    padding: 4px 10px;\n    border-radius: 4px;\n    font-family: 'Consolas', monospace;\n    font-size: 0.88em;\n    margin-top: 6px;\n    font-weight: 600;\n  }\n\n  .nav-links { text-align: center; margin: 30px 0; }\n  .nav-links a {\n    display: inline-block;\n    padding: 10px 20px;\n    background: #1a237e;\n    color: #fff;\n    text-decoration: none;\n    border-radius: 6px;\n    margin: 5px;\n    transition: background 0.2s;\n  }\n  .nav-links a:hover { background: #283593; }\n\n  .toc {\n    background: #fff;\n    padding: 22px;\n    border-radius: 10px;\n    box-shadow: 0 3px 10px rgba(0,0,0,0.08);\n    margin-bottom: 25px;\n  }\n  .toc h3 {\n    margin-top: 0;\n    color: #1a237e;\n    border-bottom: 2px solid #e0e0e0;\n    padding-bottom: 10px;\n  }\n  .toc h4 {\n    margin-top: 16px;\n    margin-bottom: 6px;\n    color: #b71c1c;\n    font-size: 1em;\n  }\n  .toc ol { margin: 0; padding-left: 22px; }\n  .toc li { padding: 4px 0; }\n  .toc a {\n    color: #1a237e;\n    text-decoration: none;\n    font-weight: 500;\n  }\n  .toc a:hover { text-decoration: underline; }\n\n  .inline-code {\n    background: #e8eaf6;\n    color: #c62828;\n    padding: 2px 7px;\n    border-radius: 4px;\n    font-family: 'Consolas', 'Monaco', monospace;\n    font-size: 0.9em;\n    font-weight: 600;\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"container\">\n  <h1>Embedded Fresher — Trang 6<\/h1>\n  <p class=\"subtitle\">20 bài Live Code: 10 DSA nâng cao + 10 RTOS/Embedded patterns<\/p>\n\n  <div class=\"stats\">\n    <span class=\"badge easy\">🟢 Dễ: 6<\/span>\n    <span class=\"badge medium\">🟡 Trung bình: 10<\/span>\n    <span class=\"badge hard\">🔴 Khó: 4<\/span>\n    <span class=\"badge rtos-tag\">🔧 RTOS: 10 bài<\/span>\n  <\/div>\n\n  <div class=\"toc\">\n    <h3>Mục lục 20 bài<\/h3>\n    <h4>Phần A — DSA nâng cao (10 bài)<\/h4>\n    <ol>\n      <li><a href=\"#a1\">Tính tổng 2 ma trận<\/a> <span class=\"badge easy\">Dễ<\/span><\/li>\n      <li><a href=\"#a2\">Nhân 2 ma trận<\/a> <span class=\"badge medium\">TB<\/span><\/li>\n      <li><a href=\"#a3\">Chuyển vị ma trận (transpose)<\/a> <span class=\"badge easy\">Dễ<\/span><\/li>\n      <li><a href=\"#a4\">Xoay ma trận 90 độ<\/a> <span class=\"badge medium\">TB<\/span><\/li>\n      <li><a href=\"#a5\">Đảo ngược từ trong câu<\/a> <span class=\"badge medium\">TB<\/span><\/li>\n      <li><a href=\"#a6\">Chuyển chuỗi sang số (atoi)<\/a> <span class=\"badge medium\">TB<\/span><\/li>\n      <li><a href=\"#a7\">Đảo ngược linked list<\/a> <span class=\"badge medium\">TB<\/span><\/li>\n      <li><a href=\"#a8\">Phát hiện chu trình linked list (Floyd)<\/a> <span class=\"badge hard\">Khó<\/span><\/li>\n      <li><a href=\"#a9\">Stack dùng mảng<\/a> <span class=\"badge easy\">Dễ<\/span><\/li>\n      <li><a href=\"#a10\">Queue dùng mảng vòng<\/a> <span class=\"badge medium\">TB<\/span><\/li>\n    <\/ol>\n    <h4>Phần B — RTOS &amp; Embedded patterns (10 bài)<\/h4>\n    <ol start=\"11\">\n      <li><a href=\"#b1\">Tạo task FreeRTOS cơ bản<\/a> <span class=\"badge easy\">Dễ<\/span><\/li>\n      <li><a href=\"#b2\">Binary semaphore đồng bộ ISR → task<\/a> <span class=\"badge medium\">TB<\/span><\/li>\n      <li><a href=\"#b3\">Mutex bảo vệ tài nguyên chia sẻ<\/a> <span class=\"badge medium\">TB<\/span><\/li>\n      <li><a href=\"#b4\">Queue truyền dữ liệu giữa 2 task<\/a> <span class=\"badge medium\">TB<\/span><\/li>\n      <li><a href=\"#b5\">Ring buffer ISR-safe cho UART RX<\/a> <span class=\"badge hard\">Khó<\/span><\/li>\n      <li><a href=\"#b6\">Debounce nút nhấn bằng timer<\/a> <span class=\"badge medium\">TB<\/span><\/li>\n      <li><a href=\"#b7\">State machine cho hệ thống nhúng<\/a> <span class=\"badge medium\">TB<\/span><\/li>\n      <li><a href=\"#b8\">Watchdog + feed định kỳ<\/a> <span class=\"badge easy\">Dễ<\/span><\/li>\n      <li><a href=\"#b9\">Event group: chờ nhiều điều kiện<\/a> <span class=\"badge hard\">Khó<\/span><\/li>\n      <li><a href=\"#b10\">Software timer định kỳ (FreeRTOS)<\/a> <span class=\"badge medium\">TB<\/span><\/li>\n    <\/ol>\n  <\/div>\n\n  <button class=\"btn-show-all\" onclick=\"toggleAll()\" id=\"btn-all\">Hiển thị tất cả đáp án<\/button>\n\n  <h2>PHẦN A — DSA NÂNG CAO<\/h2>\n  <div id=\"part-a\"><\/div>\n\n  <h2 class=\"rtos\">PHẦN B — RTOS &amp; EMBEDDED PATTERNS<\/h2>\n  <div id=\"part-b\"><\/div>\n\n  <div class=\"nav-links\">\n    <a href=\"embedded-quiz-1.html\">← Trang 1<\/a>\n    <a href=\"embedded-quiz-2.html\">← Trang 2<\/a>\n    <a href=\"embedded-quiz-3.html\">← Trang 3<\/a>\n    <a href=\"embedded-quiz-4.html\">← Trang 4<\/a>\n    <a href=\"embedded-quiz-5.html\">← Trang 5<\/a>\n  <\/div>\n<\/div>\n\n<script>\n// ============================================================\n// PHẦN A — DSA NÂNG CAO (10 bài)\n// ============================================================\nconst partA = [\n{\n  id: \"a1\", level: \"easy\", title: \"Tính tổng 2 ma trận\",\n  desc: 'Viết hàm cộng 2 ma trận kích thước m×n.',\n  example: `Input:  A = [[1,2],[3,4]], B = [[5,6],[7,8]]\nOutput: C = [[6,8],[10,12]]`,\n  solution: `#include <stdio.h>\n\nvoid add_matrix(int a[2][2], int b[2][2], int c[2][2], int m, int n) {\n    for (int i = 0; i < m; i++)\n        for (int j = 0; j < n; j++)\n            c[i][j] = a[i][j] + b[i][j];\n}\n\nint main() {\n    int a[2][2] = {{1,2},{3,4}};\n    int b[2][2] = {{5,6},{7,8}};\n    int c[2][2];\n    add_matrix(a, b, c, 2, 2);\n    for (int i = 0; i < 2; i++) {\n        for (int j = 0; j < 2; j++) printf(\"%d \", c[i][j]);\n        printf(\"\\\\n\");\n    }\n    return 0;\n}`,\n  explain: `- Duyệt 2 vòng lặp lồng nhau qua từng ô (i, j).\n- Cộng phần tử tương ứng: c[i][j] = a[i][j] + b[i][j].\n- Time O(m*n), space O(1) nếu ghi vào mảng c có sẵn.`,\n  complexity: \"Time: O(m×n) | Space: O(1)\"\n},\n{\n  id: \"a2\", level: \"medium\", title: \"Nhân 2 ma trận\",\n  desc: 'Viết hàm nhân 2 ma trận A (m×k) và B (k×n) → C (m×n).',\n  example: `Input:  A = [[1,2],[3,4]], B = [[5,6],[7,8]]\nOutput: C = [[19,22],[43,50]]`,\n  solution: `#include <stdio.h>\n\nvoid mul_matrix(int a[2][2], int b[2][2], int c[2][2], int m, int k, int n) {\n    for (int i = 0; i < m; i++) {\n        for (int j = 0; j < n; j++) {\n            c[i][j] = 0;\n            for (int x = 0; x < k; x++) {\n                c[i][j] += a[i][x] * b[x][j];\n            }\n        }\n    }\n}\n\nint main() {\n    int a[2][2] = {{1,2},{3,4}};\n    int b[2][2] = {{5,6},{7,8}};\n    int c[2][2];\n    mul_matrix(a, b, c, 2, 2, 2);\n    for (int i = 0; i < 2; i++) {\n        for (int j = 0; j < 2; j++) printf(\"%d \", c[i][j]);\n        printf(\"\\\\n\");\n    }\n    return 0;\n}`,\n  explain: `- 3 vòng lặp lồng nhau: i (hàng C), j (cột C), x (chiều chung).\n- C[i][j] = sum(A[i][x] * B[x][j]) với x từ 0..k-1.\n- Time O(m*n*k). Với ma trận vuông n×n → O(n³).\n- Có thể tối ưu bằng Strassen (O(n^2.807)) nhưng phức tạp.`,\n  complexity: \"Time: O(m×n×k) | Space: O(1)\"\n},\n{\n  id: \"a3\", level: \"easy\", title: \"Chuyển vị ma trận (transpose)\",\n  desc: 'Viết hàm chuyển vị ma trận tại chỗ (chỉ cho ma trận vuông).',\n  example: `Input:  A = [[1,2,3],[4,5,6],[7,8,9]]\nOutput: A = [[1,4,7],[2,5,8],[3,6,9]]`,\n  solution: `#include <stdio.h>\n\nvoid transpose(int a[3][3], int n) {\n    for (int i = 0; i < n; i++) {\n        for (int j = i + 1; j < n; j++) {\n            int t = a[i][j];\n            a[i][j] = a[j][i];\n            a[j][i] = t;\n        }\n    }\n}\n\nint main() {\n    int a[3][3] = {{1,2,3},{4,5,6},{7,8,9}};\n    transpose(a, 3);\n    for (int i = 0; i < 3; i++) {\n        for (int j = 0; j < 3; j++) printf(\"%d \", a[i][j]);\n        printf(\"\\\\n\");\n    }\n    return 0;\n}`,\n  explain: `- Chỉ duyệt tam giác trên (j > i) để tránh hoán đổi 2 lần.\n- Đổi chỗ a[i][j] với a[j][i].\n- Time O(n²), space O(1).`,\n  complexity: \"Time: O(n²) | Space: O(1)\"\n},\n{\n  id: \"a4\", level: \"medium\", title: \"Xoay ma trận 90 độ theo chiều kim đồng hồ\",\n  desc: 'Xoay ma trận vuông n×n 90° clockwise, tại chỗ.',\n  example: `Input:  [[1,2,3],[4,5,6],[7,8,9]]\nOutput: [[7,4,1],[8,5,2],[9,6,3]]`,\n  solution: `#include <stdio.h>\n\nvoid rotate_90(int a[3][3], int n) {\n    // Bước 1: transpose\n    for (int i = 0; i < n; i++)\n        for (int j = i + 1; j < n; j++) {\n            int t = a[i][j]; a[i][j] = a[j][i]; a[j][i] = t;\n        }\n    // Bước 2: đảo từng hàng\n    for (int i = 0; i < n; i++) {\n        for (int j = 0; j < n / 2; j++) {\n            int t = a[i][j]; a[i][j] = a[i][n-1-j]; a[i][n-1-j] = t;\n        }\n    }\n}\n\nint main() {\n    int a[3][3] = {{1,2,3},{4,5,6},{7,8,9}};\n    rotate_90(a, 3);\n    for (int i = 0; i < 3; i++) {\n        for (int j = 0; j < 3; j++) printf(\"%d \", a[i][j]);\n        printf(\"\\\\n\");\n    }\n    return 0;\n}`,\n  explain: `- Trick: xoay 90° clockwise = transpose + đảo ngược mỗi hàng.\n- Ngược lại, xoay 90° counter-clockwise = transpose + đảo ngược mỗi cột.\n- Time O(n²), space O(1).`,\n  complexity: \"Time: O(n²) | Space: O(1)\"\n},\n{\n  id: \"a5\", level: \"medium\", title: \"Đảo ngược từ trong câu\",\n  desc: 'Đảo ngược thứ tự các từ trong câu, không đảo ký tự trong từ.',\n  example: `Input:  \"hello world from C\"\nOutput: \"C from world hello\"`,\n  solution: `#include <stdio.h>\n#include <string.h>\n\nvoid reverse_range(char *s, int l, int r) {\n    while (l < r) {\n        char t = s[l]; s[l] = s[r]; s[r] = t;\n        l++; r--;\n    }\n}\n\nvoid reverse_words(char *s) {\n    int n = strlen(s);\n    reverse_range(s, 0, n - 1);   // đảo toàn chuỗi\n    int start = 0;\n    for (int i = 0; i <= n; i++) {\n        if (s[i] == ' ' || s[i] == '\\\\0') {\n            reverse_range(s, start, i - 1);  // đảo từng từ\n            start = i + 1;\n        }\n    }\n}\n\nint main() {\n    char s[] = \"hello world from C\";\n    reverse_words(s);\n    printf(\"%s\\\\n\", s);  // C from world hello\n    return 0;\n}`,\n  explain: `- Bước 1: đảo toàn bộ chuỗi → \"C morf dlrow olleh\".\n- Bước 2: đảo từng từ riêng → \"C from world hello\".\n- Cần tách từ bằng dấu space hoặc '\\\\0'.\n- Time O(n), space O(1).`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"a6\", level: \"medium\", title: \"Chuyển chuỗi sang số (atoi)\",\n  desc: 'Viết hàm <span class=\"inline-code\">int my_atoi(const char *s)<\/span> chuyển chuỗi số thành int. Bỏ qua khoảng trắng đầu, xử lý dấu +/-.',\n  example: `Input:  \"  -1234abc\"\nOutput: -1234\n\nInput:  \"42\"\nOutput: 42`,\n  solution: `#include <stdio.h>\n#include <ctype.h>\n#include <limits.h>\n\nint my_atoi(const char *s) {\n    int i = 0, sign = 1;\n    long result = 0;\n\n    while (isspace((unsigned char)s[i])) i++;\n\n    if (s[i] == '+' || s[i] == '-') {\n        sign = (s[i] == '-') ? -1 : 1;\n        i++;\n    }\n\n    while (isdigit((unsigned char)s[i])) {\n        result = result * 10 + (s[i] - '0');\n        if (result * sign > INT_MAX) return INT_MAX;\n        if (result * sign < INT_MIN) return INT_MIN;\n        i++;\n    }\n    return (int)(sign * result);\n}\n\nint main() {\n    printf(\"%d\\\\n\", my_atoi(\"  -1234abc\"));  // -1234\n    printf(\"%d\\\\n\", my_atoi(\"42\"));          // 42\n    printf(\"%d\\\\n\", my_atoi(\"   +99\"));      // 99\n    return 0;\n}`,\n  explain: `- Bỏ qua whitespace đầu bằng isspace.\n- Xử lý dấu +/- nếu có.\n- Duyệt các chữ số, tích lũy: result = result*10 + digit.\n- Kiểm tra overflow với INT_MAX/INT_MIN.\n- Dừng khi gặp ký tự không phải số.`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"a7\", level: \"medium\", title: \"Đảo ngược linked list\",\n  desc: 'Viết hàm đảo ngược singly linked list (in-place, không dùng mảng phụ).',\n  example: `Input:  1 -> 2 -> 3 -> 4 -> NULL\nOutput: 4 -> 3 -> 2 -> 1 -> NULL`,\n  solution: `#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\n\nNode* reverse_list(Node *head) {\n    Node *prev = NULL;\n    Node *curr = head;\n    while (curr != NULL) {\n        Node *next = curr->next;\n        curr->next = prev;\n        prev = curr;\n        curr = next;\n    }\n    return prev;\n}\n\nNode* push(Node *head, int v) {\n    Node *n = (Node*)malloc(sizeof(Node));\n    n->data = v; n->next = head;\n    return n;\n}\n\nvoid print(Node *h) {\n    while (h) { printf(\"%d -> \", h->data); h = h->next; }\n    printf(\"NULL\\\\n\");\n}\n\nint main() {\n    Node *h = NULL;\n    h = push(h, 1); h = push(h, 2); h = push(h, 3); h = push(h, 4);\n    print(h);          // 4 -> 3 -> 2 -> 1 -> NULL\n    h = reverse_list(h);\n    print(h);          // 1 -> 2 -> 3 -> 4 -> NULL\n    return 0;\n}`,\n  explain: `- Dùng 3 con trỏ: prev, curr, next.\n- Mỗi bước: lưu next, đảo curr->next trỏ về prev, dịch prev và curr.\n- Sau vòng lặp, prev là head mới.\n- Time O(n), space O(1).`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"a8\", level: \"hard\", title: \"Phát hiện chu trình trong linked list (Floyd)\",\n  desc: 'Kiểm tra linked list có chu trình (cycle) không, dùng thuật toán rùa và thỏ.',\n  example: `Input:  1 -> 2 -> 3 -> 4 -> 2 (cycle)\nOutput: true\n\nInput:  1 -> 2 -> 3 -> NULL\nOutput: false`,\n  solution: `#include <stdio.h>\n#include <stdbool.h>\n\ntypedef struct Node { int data; struct Node *next; } Node;\n\nbool has_cycle(Node *head) {\n    Node *slow = head;\n    Node *fast = head;\n    while (fast != NULL && fast->next != NULL) {\n        slow = slow->next;\n        fast = fast->next->next;\n        if (slow == fast) return true;\n    }\n    return false;\n}\n\nint main() {\n    Node n1 = {1, NULL}, n2 = {2, NULL}, n3 = {3, NULL}, n4 = {4, NULL};\n    n1.next = &n2; n2.next = &n3; n3.next = &n4; n4.next = &n2;\n    printf(\"%d\\\\n\", has_cycle(&n1));  // 1\n    n4.next = NULL;\n    printf(\"%d\\\\n\", has_cycle(&n1));  // 0\n    return 0;\n}`,\n  explain: `- Thuật toán Floyd (tortoise & hare).\n- slow đi 1 bước, fast đi 2 bước.\n- Nếu có chu trình, fast sẽ đuổi kịp slow.\n- Nếu fast chạm NULL → không có cycle.\n- Time O(n), space O(1).`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"a9\", level: \"easy\", title: \"Stack dùng mảng\",\n  desc: 'Cài đặt stack với push, pop, peek, isEmpty dùng mảng tĩnh.',\n  example: `push(1), push(2), push(3)\npop() → 3\npeek() → 2`,\n  solution: `#include <stdio.h>\n#include <stdbool.h>\n\n#define MAX 100\n\ntypedef struct {\n    int data[MAX];\n    int top;\n} Stack;\n\nvoid init(Stack *s) { s->top = -1; }\nbool is_empty(Stack *s) { return s->top == -1; }\nbool is_full(Stack *s) { return s->top == MAX - 1; }\n\nbool push(Stack *s, int v) {\n    if (is_full(s)) return false;\n    s->data[++s->top] = v;\n    return true;\n}\n\nbool pop(Stack *s, int *out) {\n    if (is_empty(s)) return false;\n    *out = s->data[s->top--];\n    return true;\n}\n\nbool peek(Stack *s, int *out) {\n    if (is_empty(s)) return false;\n    *out = s->data[s->top];\n    return true;\n}\n\nint main() {\n    Stack s; init(&s);\n    push(&s, 1); push(&s, 2); push(&s, 3);\n    int v;\n    pop(&s, &v); printf(\"pop = %d\\\\n\", v);   // 3\n    peek(&s, &v); printf(\"peek = %d\\\\n\", v); // 2\n    return 0;\n}`,\n  explain: `- top = -1 nghĩa là stack rỗng.\n- push: tăng top rồi gán data[top].\n- pop: lấy data[top] rồi giảm top.\n- peek: lấy data[top] không đổi top.\n- Tất cả O(1).`,\n  complexity: \"Time: O(1) | Space: O(n)\"\n},\n{\n  id: \"a10\", level: \"medium\", title: \"Queue dùng mảng vòng (circular queue)\",\n  desc: 'Cài đặt queue bằng mảng vòng (circular) với enqueue, dequeue.',\n  example: `enqueue(1), enqueue(2), enqueue(3)\ndequeue() → 1\ndequeue() → 2`,\n  solution: `#include <stdio.h>\n#include <stdbool.h>\n\n#define MAX 5\n\ntypedef struct {\n    int data[MAX];\n    int head, tail, count;\n} Queue;\n\nvoid init(Queue *q) { q->head = 0; q->tail = 0; q->count = 0; }\nbool is_empty(Queue *q) { return q->count == 0; }\nbool is_full(Queue *q) { return q->count == MAX; }\n\nbool enqueue(Queue *q, int v) {\n    if (is_full(q)) return false;\n    q->data[q->tail] = v;\n    q->tail = (q->tail + 1) % MAX;\n    q->count++;\n    return true;\n}\n\nbool dequeue(Queue *q, int *out) {\n    if (is_empty(q)) return false;\n    *out = q->data[q->head];\n    q->head = (q->head + 1) % MAX;\n    q->count--;\n    return true;\n}\n\nint main() {\n    Queue q; init(&q);\n    enqueue(&q, 1); enqueue(&q, 2); enqueue(&q, 3);\n    int v;\n    dequeue(&q, &v); printf(\"%d\\\\n\", v);  // 1\n    dequeue(&q, &v); printf(\"%d\\\\n\", v);  // 2\n    return 0;\n}`,\n  explain: `- Dùng head (đọc) và tail (ghi), wrap-around bằng % MAX.\n- count giúp phân biệt full/empty mà không cần chừa slot.\n- enqueue: ghi vào tail, tăng tail.\n- dequeue: đọc từ head, tăng head.\n- Tất cả O(1).`,\n  complexity: \"Time: O(1) | Space: O(n)\"\n}\n];\n\n// ============================================================\n// PHẦN B — RTOS & EMBEDDED PATTERNS (10 bài)\n// ============================================================\nconst partB = [\n{\n  id: \"b1\", level: \"easy\", title: \"Tạo task FreeRTOS cơ bản\",\n  desc: 'Viết chương trình FreeRTOS có 2 task: một task blink LED mỗi 500ms, một task in \"Hello\" mỗi 1s.',\n  example: `Yêu cầu: 2 task chạy song song \"như\" đồng thời.\n- Task 1: LED toggle mỗi 500ms\n- Task 2: printf mỗi 1000ms`,\n  solution: `#include \"FreeRTOS.h\"\n#include \"task.h\"\n#include <stdio.h>\n\nvoid vTaskLED(void *pv) {\n    (void)pv;\n    for (;;) {\n        // HAL_GPIO_TogglePin(LED_PORT, LED_PIN);  // giả lập\n        printf(\"[LED] toggle\\\\n\");\n        vTaskDelay(pdMS_TO_TICKS(500));\n    }\n}\n\nvoid vTaskPrint(void *pv) {\n    (void)pv;\n    for (;;) {\n        printf(\"[PRINT] Hello\\\\n\");\n        vTaskDelay(pdMS_TO_TICKS(1000));\n    }\n}\n\nint main(void) {\n    xTaskCreate(vTaskLED,   \"LED\",   128, NULL, 2, NULL);\n    xTaskCreate(vTaskPrint, \"Print\", 256, NULL, 1, NULL);\n    vTaskStartScheduler();\n    for (;;);\n}`,\n  explain: `- xTaskCreate tạo task với stack, priority khác nhau.\n- Task có priority cao hơn (LED = 2) sẽ chạy trước khi cả 2 ready.\n- vTaskDelay đưa task vào Blocked state → nhường CPU cho task khác.\n- vTaskStartScheduler khởi động scheduler, không bao giờ return (trừ lỗi).`,\n  complexity: \"Preemptive scheduling | Priority-based\"\n},\n{\n  id: \"b2\", level: \"medium\", title: \"Binary semaphore đồng bộ ISR → task\",\n  desc: 'Dùng binary semaphore để đánh thức task xử lý khi ISR (ví dụ nút nhấn) xảy ra.',\n  example: `Button ISR bấm → give semaphore.\nTask chờ semaphore → xử lý (debounce, in ra...).`,\n  solution: `#include \"FreeRTOS.h\"\n#include \"task.h\"\n#include \"semphr.h\"\n#include <stdio.h>\n\nSemaphoreHandle_t xBtnSem;\n\nvoid vTaskButtonHandler(void *pv) {\n    (void)pv;\n    for (;;) {\n        // Chờ semaphore vô hạn\n        if (xSemaphoreTake(xBtnSem, portMAX_DELAY) == pdTRUE) {\n            printf(\"Button pressed!\\\\n\");\n            // xử lý debounce, toggle LED, ...\n        }\n    }\n}\n\n// ISR ví dụ (trên STM32 sẽ gắn vào EXTI IRQHandler)\nvoid EXTI0_IRQHandler(void) {\n    BaseType_t xHigherPriorityTaskWoken = pdFALSE;\n    // ... clear interrupt flag ...\n    xSemaphoreGiveFromISR(xBtnSem, &xHigherPriorityTaskWoken);\n    portYIELD_FROM_ISR(xHigherPriorityTaskWoken);\n}\n\nint main(void) {\n    xBtnSem = xSemaphoreCreateBinary();\n    xTaskCreate(vTaskButtonHandler, \"Btn\", 256, NULL, 3, NULL);\n    vTaskStartScheduler();\n    for (;;);\n}`,\n  explain: `- Binary semaphore = signaling, không phải bảo vệ tài nguyên.\n- ISR dùng xSemaphoreGiveFromISR (không dùng xSemaphoreGive vì không an toàn trong ISR).\n- portYIELD_FROM_ISR để chuyển ngữ cảnh ngay nếu task wake có priority cao hơn.\n- Task dùng xSemaphoreTake với portMAX_DELAY để chờ vô hạn.`,\n  complexity: \"ISR-safe | Deferred processing pattern\"\n},\n{\n  id: \"b3\", level: \"medium\", title: \"Mutex bảo vệ tài nguyên chia sẻ\",\n  desc: 'Dùng mutex để bảo vệ biến chia sẻ giữa 2 task (tránh race condition).',\n  example: `2 task cùng tăng counter 1000 lần → kết quả phải là 2000 (không mất update).`,\n  solution: `#include \"FreeRTOS.h\"\n#include \"task.h\"\n#include \"semphr.h\"\n#include <stdio.h>\n\nSemaphoreHandle_t xMutex;\nvolatile int counter = 0;\n\nvoid vTaskInc(void *pv) {\n    (void)pv;\n    for (int i = 0; i < 1000; i++) {\n        xSemaphoreTake(xMutex, portMAX_DELAY);\n        counter++;  // critical section\n        xSemaphoreGive(xMutex);\n    }\n    vTaskDelete(NULL);\n}\n\nint main(void) {\n    xMutex = xSemaphoreCreateMutex();\n    xTaskCreate(vTaskInc, \"T1\", 256, NULL, 2, NULL);\n    xTaskCreate(vTaskInc, \"T2\", 256, NULL, 2, NULL);\n\n    vTaskStartScheduler();\n    for (;;);\n}`,\n  explain: `- Mutex khác binary semaphore: có ownership + priority inheritance.\n- xSemaphoreTake / Give bao quanh critical section.\n- Không được take/give mutex trong ISR (dùng semaphore thay thế).\n- Priority inheritance tránh priority inversion.\n- Kết quả counter cuối cùng = 2000 (không mất update).`,\n  complexity: \"Mutual exclusion | Priority inheritance\"\n},\n{\n  id: \"b4\", level: \"medium\", title: \"Queue truyền dữ liệu giữa 2 task\",\n  desc: 'Producer task đọc cảm biến và gửi qua queue; Consumer task nhận và xử lý.',\n  example: `Producer: đọc ADC mỗi 100ms → queue\nConsumer: nhận từ queue → in giá trị`,\n  solution: `#include \"FreeRTOS.h\"\n#include \"task.h\"\n#include \"queue.h\"\n#include <stdio.h>\n\ntypedef struct {\n    uint32_t timestamp;\n    uint16_t value;\n} SensorData;\n\nQueueHandle_t xQueue;\n\nvoid vProducer(void *pv) {\n    (void)pv;\n    SensorData d;\n    uint32_t ts = 0;\n    for (;;) {\n        d.timestamp = ts++;\n        d.value = 1234;  // giả lập đọc ADC\n        xQueueSend(xQueue, &d, portMAX_DELAY);\n        vTaskDelay(pdMS_TO_TICKS(100));\n    }\n}\n\nvoid vConsumer(void *pv) {\n    (void)pv;\n    SensorData d;\n    for (;;) {\n        if (xQueueReceive(xQueue, &d, portMAX_DELAY) == pdTRUE) {\n            printf(\"t=%lu, val=%u\\\\n\", d.timestamp, d.value);\n        }\n    }\n}\n\nint main(void) {\n    xQueue = xQueueCreate(10, sizeof(SensorData));\n    xTaskCreate(vProducer, \"Prod\", 256, NULL, 2, NULL);\n    xTaskCreate(vConsumer, \"Cons\", 256, NULL, 1, NULL);\n    vTaskStartScheduler();\n    for (;;);\n}`,\n  explain: `- Queue truyền dữ liệu theo FIFO, an toàn giữa các task.\n- xQueueSend block nếu queue đầy (portMAX_DELAY = chờ vô hạn).\n- xQueueReceive block nếu queue rỗng.\n- Truyền struct qua queue an toàn (copy by value).\n- ISR dùng xQueueSendFromISR.`,\n  complexity: \"Producer-Consumer pattern | Thread-safe\"\n},\n{\n  id: \"b5\", level: \"hard\", title: \"Ring buffer ISR-safe cho UART RX\",\n  desc: 'Cài đặt ring buffer cho UART: ISR ghi vào buffer, main loop đọc ra. Không dùng lock.',\n  example: `UART RX ISR → ring_put(byte)\nMain loop → ring_get() → xử lý`,\n  solution: `#include <stdint.h>\n#include <stdbool.h>\n#include <stdio.h>\n\n#define RING_SIZE 64\n\ntypedef struct {\n    uint8_t buf[RING_SIZE];\n    volatile uint16_t head;   // ISR ghi\n    volatile uint16_t tail;   // main đọc\n} RingBuf;\n\nstatic RingBuf rb;\n\n// CHỈ gọi từ ISR\nbool ring_put_isr(RingBuf *r, uint8_t b) {\n    uint16_t next = (r->head + 1) % RING_SIZE;\n    if (next == r->tail) return false;  // full\n    r->buf[r->head] = b;\n    r->head = next;\n    return true;\n}\n\n// CHỈ gọi từ main loop (non-ISR)\nbool ring_get(RingBuf *r, uint8_t *b) {\n    if (r->head == r->tail) return false;  // empty\n    *b = r->buf[r->tail];\n    r->tail = (r->tail + 1) % RING_SIZE;\n    return true;\n}\n\n// Ví dụ ISR UART (giả lập)\nvoid USART1_IRQHandler(void) {\n    uint8_t byte = 0x41;  // giả lập đọc DR\n    ring_put_isr(&rb, byte);\n}\n\nint main(void) {\n    rb.head = rb.tail = 0;\n    // giả lập ISR gọi 3 lần\n    ring_put_isr(&rb, 'A');\n    ring_put_isr(&rb, 'B');\n    ring_put_isr(&rb, 'C');\n\n    uint8_t b;\n    while (ring_get(&rb, &b)) {\n        printf(\"%c \", b);  // A B C\n    }\n    printf(\"\\\\n\");\n    return 0;\n}`,\n  explain: `- Ring buffer single-producer single-consumer (SPSC) → không cần lock.\n- head/tail PHẢI là volatile vì ISR thay đổi bất đồng bộ.\n- ISR chỉ ghi vào head, main chỉ ghi vào tail → không có race.\n- Chừa 1 slot để phân biệt full/empty (head+1 == tail → full).\n- Đây là pattern chuẩn cho UART RX trong embedded.`,\n  complexity: \"O(1) put/get | Lock-free SPSC\"\n},\n{\n  id: \"b6\", level: \"medium\", title: \"Debounce nút nhấn bằng timer\",\n  desc: 'Viết hàm debounce nút nhấn dùng millis(), trả về true khi phát hiện cạnh xuống (falling edge).',\n  example: `Nút nhấn phần cứng bị rung (bounce) 5-20ms.\nDebounce: bỏ qua các thay đổi trong 20ms.`,\n  solution: `#include <stdbool.h>\n#include <stdint.h>\n#include <stdio.h>\n\n#define DEBOUNCE_MS 20\n\ntypedef struct {\n    bool last_state;\n    bool stable_state;\n    uint32_t last_change_time;\n} Debouncer;\n\n// millis() giả lập\nstatic uint32_t fake_millis = 0;\nuint32_t millis(void) { return fake_millis; }\n\n// raw_state: đọc trực tiếp GPIO (0 hoặc 1)\n// Trả true 1 lần khi phát hiện nhấn (cạnh xuống)\nbool debounce_update(Debouncer *d, bool raw_state) {\n    uint32_t now = millis();\n    if (raw_state != d->last_state) {\n        d->last_change_time = now;\n        d->last_state = raw_state;\n    }\n    if ((now - d->last_change_time) >= DEBOUNCE_MS) {\n        if (d->stable_state != raw_state) {\n            d->stable_state = raw_state;\n            if (d->stable_state == false) {  // falling edge (nhấn)\n                return true;\n            }\n        }\n    }\n    return false;\n}\n\nint main(void) {\n    Debouncer d = {true, true, 0};\n\n    fake_millis = 100;\n    debounce_update(&d, false);  // bắt đầu rung\n\n    fake_millis = 115;\n    debounce_update(&d, true);   // rung lại\n\n    fake_millis = 125;\n    bool pressed = debounce_update(&d, false);  // ổn định 20ms\n    printf(\"pressed = %d\\\\n\", pressed);  // 1\n\n    return 0;\n}`,\n  explain: `- Lưu last_state (raw) và stable_state (đã debounce).\n- Nếu raw đổi → cập nhật last_change_time.\n- Nếu raw giữ nguyên >= DEBOUNCE_MS → chấp nhận là stable.\n- Trả true 1 lần khi phát hiện cạnh xuống (nhấn).\n- Không dùng delay() → không block CPU.`,\n  complexity: \"Non-blocking | O(1) per call\"\n},\n{\n  id: \"b7\", level: \"medium\", title: \"State machine cho hệ thống nhúng\",\n  desc: 'Cài đặt state machine đơn giản cho máy bán nước: IDLE → COIN_INSERTED → DISPENSING.',\n  example: `Bấm coin → COIN_INSERTED\nChọn nước → DISPENSING\nXong → IDLE`,\n  solution: `#include <stdio.h>\n#include <stdbool.h>\n\ntypedef enum {\n    STATE_IDLE,\n    STATE_COIN_INSERTED,\n    STATE_DISPENSING,\n    STATE_ERROR\n} State;\n\ntypedef enum {\n    EVENT_COIN,\n    EVENT_SELECT,\n    EVENT_DONE,\n    EVENT_RESET\n} Event;\n\ntypedef struct {\n    State state;\n    int credit;\n} VendingMachine;\n\nvoid handle_event(VendingMachine *vm, Event e) {\n    switch (vm->state) {\n        case STATE_IDLE:\n            if (e == EVENT_COIN) {\n                vm->credit += 5;\n                vm->state = STATE_COIN_INSERTED;\n                printf(\"-> COIN_INSERTED (credit=%d)\\\\n\", vm->credit);\n            }\n            break;\n\n        case STATE_COIN_INSERTED:\n            if (e == EVENT_COIN) {\n                vm->credit += 5;\n                printf(\"credit=%d\\\\n\", vm->credit);\n            } else if (e == EVENT_SELECT && vm->credit >= 10) {\n                vm->state = STATE_DISPENSING;\n                printf(\"-> DISPENSING\\\\n\");\n            } else if (e == EVENT_RESET) {\n                vm->credit = 0;\n                vm->state = STATE_IDLE;\n                printf(\"-> IDLE (refund)\\\\n\");\n            }\n            break;\n\n        case STATE_DISPENSING:\n            if (e == EVENT_DONE) {\n                vm->credit -= 10;\n                vm->state = STATE_IDLE;\n                printf(\"-> IDLE\\\\n\");\n            }\n            break;\n\n        case STATE_ERROR:\n            if (e == EVENT_RESET) vm->state = STATE_IDLE;\n            break;\n    }\n}\n\nint main(void) {\n    VendingMachine vm = {STATE_IDLE, 0};\n    handle_event(&vm, EVENT_COIN);    // -> COIN_INSERTED\n    handle_event(&vm, EVENT_COIN);    // credit=10\n    handle_event(&vm, EVENT_SELECT);  // -> DISPENSING\n    handle_event(&vm, EVENT_DONE);    // -> IDLE\n    return 0;\n}`,\n  explain: `- State machine = tập trạng thái + sự kiện + chuyển trạng thái.\n- switch(state) xử lý event theo từng trạng thái.\n- Mỗi state quyết định event nào có ý nghĩa.\n- Dễ mở rộng, dễ debug so với if-else lồng nhau.\n- Trong embedded: dùng cho protocol parser, UI, motor control...`,\n  complexity: \"O(1) per event | Extensible\"\n},\n{\n  id: \"b8\", level: \"easy\", title: \"Watchdog + feed định kỳ\",\n  desc: 'Cấu hình watchdog timer và feed định kỳ trong task riêng. Nếu task chính treo → reset.',\n  example: `Watchdog timeout = 2s.\nTask feed mỗi 500ms.\nNếu task treo > 2s → chip reset.`,\n  solution: `#include \"FreeRTOS.h\"\n#include \"task.h\"\n#include <stdio.h>\n\n// Giả lập API watchdog (thực tế dùng HAL_IWDG_Refresh)\nvoid wdg_init(uint32_t timeout_ms) {\n    printf(\"[WDG] init timeout=%lu ms\\\\n\", timeout_ms);\n}\nvoid wdg_feed(void) {\n    printf(\"[WDG] fed\\\\n\");\n}\n\n// Điều kiện \"hệ thống khỏe\"\nvolatile int system_healthy = 1;\n\nvoid vTaskFeed(void *pv) {\n    (void)pv;\n    for (;;) {\n        if (system_healthy) {\n            wdg_feed();\n        } else {\n            printf(\"[WDG] system unhealthy -> KHONG feed\\\\n\");\n        }\n        vTaskDelay(pdMS_TO_TICKS(500));\n    }\n}\n\nvoid vTaskMain(void *pv) {\n    (void)pv;\n    for (;;) {\n        // ... công việc chính ...\n        printf(\"[MAIN] working\\\\n\");\n        vTaskDelay(pdMS_TO_TICKS(1000));\n\n        // Giả lập: đôi khi main treo\n        // system_healthy = 0;\n    }\n}\n\nint main(void) {\n    wdg_init(2000);\n    xTaskCreate(vTaskFeed, \"Feed\", 256, NULL, 3, NULL);\n    xTaskCreate(vTaskMain, \"Main\", 256, NULL, 2, NULL);\n    vTaskStartScheduler();\n    for (;;);\n}`,\n  explain: `- Watchdog phải được feed định kỳ trước timeout, nếu không → reset chip.\n- Feed trong task riêng với priority cao.\n- Chỉ feed khi \"system healthy\" — nếu task chính treo, không feed → reset.\n- Timeout phải > tổng thời gian xử lý xấu nhất của hệ thống.\n- Có thể dùng task watchdog của FreeRTOS (esp_task_wdt trên ESP32).`,\n  complexity: \"Safety mechanism | Fail-safe reset\"\n},\n{\n  id: \"b9\", level: \"hard\", title: \"Event group: chờ nhiều điều kiện\",\n  desc: 'Dùng event group để đợi 2 sự kiện (WiFi connected + Sensor ready) trước khi bắt đầu task chính.',\n  example: `Task xử lý chờ cả 2 bit:\n- BIT_WIFI (0x01)\n- BIT_SENSOR (0x02)\nKhi có đủ cả 2 → chạy.`,\n  solution: `#include \"FreeRTOS.h\"\n#include \"task.h\"\n#include \"event_groups.h\"\n#include <stdio.h>\n\n#define BIT_WIFI    (1 << 0)\n#define BIT_SENSOR  (1 << 1)\n#define BITS_READY  (BIT_WIFI | BIT_SENSOR)\n\nEventGroupHandle_t xEvents;\n\nvoid vTaskWiFi(void *pv) {\n    (void)pv;\n    vTaskDelay(pdMS_TO_TICKS(500));  // giả lập kết nối\n    printf(\"WiFi connected\\\\n\");\n    xEventGroupSetBits(xEvents, BIT_WIFI);\n    vTaskDelete(NULL);\n}\n\nvoid vTaskSensor(void *pv) {\n    (void)pv;\n    vTaskDelay(pdMS_TO_TICKS(800));  // giả lập init\n    printf(\"Sensor ready\\\\n\");\n    xEventGroupSetBits(xEvents, BIT_SENSOR);\n    vTaskDelete(NULL);\n}\n\nvoid vTaskMain(void *pv) {\n    (void)pv;\n    printf(\"Cho WiFi + Sensor...\\\\n\");\n    // Chờ cả 2 bit, clear khi thoát (auto-clear)\n    xEventGroupWaitBits(xEvents,\n                        BITS_READY,   // bit cần chờ\n                        pdTRUE,       // clear khi thoát\n                        pdTRUE,       // chờ TẤT CẢ bit\n                        portMAX_DELAY);\n    printf(\">>> Bat dau task chinh!\\\\n\");\n    for (;;) {\n        vTaskDelay(pdMS_TO_TICKS(1000));\n    }\n}\n\nint main(void) {\n    xEvents = xEventGroupCreate();\n    xTaskCreate(vTaskWiFi,   \"WiFi\",   256, NULL, 2, NULL);\n    xTaskCreate(vTaskSensor, \"Sensor\", 256, NULL, 2, NULL);\n    xTaskCreate(vTaskMain,   \"Main\",   512, NULL, 3, NULL);\n    vTaskStartScheduler();\n    for (;;);\n}`,\n  explain: `- Event group = nhiều bit, mỗi bit là 1 sự kiện.\n- xEventGroupWaitBits chờ tập bit: pdTRUE = chờ tất cả, pdFALSE = chờ bất kỳ.\n- xEventGroupSetBits gọi từ task; xEventGroupSetBitsFromISR gọi từ ISR.\n- Clear bit khi thoát (auto-clear) hoặc tự clear sau.\n- Dùng khi task cần chờ nhiều điều kiện khởi tạo.`,\n  complexity: \"Bit-based sync | Wait-all / wait-any\"\n},\n{\n  id: \"b10\", level: \"medium\", title: \"Software timer định kỳ (FreeRTOS)\",\n  desc: 'Dùng software timer để toggle LED mỗi 500ms, không cần task riêng.',\n  example: `Timer callback chạy mỗi 500ms.\nCallback toggle LED.\nKhông block, không task riêng.`,\n  solution: `#include \"FreeRTOS.h\"\n#include \"timers.h\"\n#include <stdio.h>\n\nTimerHandle_t xLedTimer;\n\nvoid vLedCallback(TimerHandle_t xTimer) {\n    (void)xTimer;\n    static int state = 0;\n    state = !state;\n    printf(\"[LED] %s\\\\n\", state ? \"ON\" : \"OFF\");\n}\n\nint main(void) {\n    xLedTimer = xTimerCreate(\n        \"LedTimer\",\n        pdMS_TO_TICKS(500),  // period\n        pdTRUE,              // auto-reload\n        NULL,\n        vLedCallback);\n\n    if (xLedTimer != NULL) {\n        xTimerStart(xLedTimer, 0);\n    }\n\n    vTaskStartScheduler();\n    for (;;);\n}`,\n  explain: `- Software timer chạy trong context của Timer Service Task (không phải task riêng).\n- pdTRUE = auto-reload (định kỳ); pdFALSE = one-shot.\n- Callback KHÔNG được block (không vTaskDelay, không take mutex lâu).\n- Tần số thấp hơn hardware timer nhưng linh hoạt, tiết kiệm task.\n- Muốn chính xác cao → dùng hardware timer.`,\n  complexity: \"Timer service task | Non-blocking callback\"\n}\n];\n\n// ============================================================\n// SYNTAX HIGHLIGHTING\n// ============================================================\nfunction highlightC(code) {\n  let s = code\n    .replace(/&/g, '&amp;')\n    .replace(/<\/g, '&lt;')\n    .replace(/>/g, '&gt;');\n\n  const ph = [];\n  let pi = 0;\n\n  s = s.replace(/\\/\\/[^\\n]*/g, (m) => { ph.push(`<span class=\"c-com\">${m}<\/span>`); return `\\u0000${pi++}\\u0000`; });\n  s = s.replace(/\\/\\*[\\s\\S]*?\\*\\//g, (m) => { ph.push(`<span class=\"c-com\">${m}<\/span>`); return `\\u0000${pi++}\\u0000`; });\n  s = s.replace(/\"(?:\\\\.|[^\"\\\\])*\"/g, (m) => { ph.push(`<span class=\"c-str\">${m}<\/span>`); return `\\u0000${pi++}\\u0000`; });\n  s = s.replace(/'(?:\\\\.|[^'\\\\])*'/g, (m) => { ph.push(`<span class=\"c-str\">${m}<\/span>`); return `\\u0000${pi++}\\u0000`; });\n  s = s.replace(/^(\\s*)(#\\w+)/gm, (m, sp, dir) => `${sp}<span class=\"c-pre\">${dir}<\/span>`);\n\n  const kws = ['int','char','void','long','short','unsigned','signed','float','double',\n    'if','else','for','while','do','switch','case','break','continue','return','goto',\n    'struct','union','enum','typedef','sizeof','const','static','extern','volatile','register',\n    'inline','NULL','true','false','bool','uint8_t','uint16_t','uint32_t','int8_t','int16_t','int32_t',\n    'uint64_t','int64_t','size_t','BaseType_t','UBaseType_t','TickType_t',\n    'TimerHandle_t','SemaphoreHandle_t','QueueHandle_t','EventGroupHandle_t'];\n  kws.forEach(kw => {\n    const re = new RegExp(`\\\\b${kw}\\\\b`, 'g');\n    s = s.replace(re, `<span class=\"c-key\">${kw}<\/span>`);\n  });\n\n  s = s.replace(/\\b(0x[0-9A-Fa-f]+|\\d+)\\b/g, '<span class=\"c-num\">$1<\/span>');\n\n  s = s.replace(/\\u0000(\\d+)\\u0000/g, (m, i) => ph[parseInt(i)]);\n  return s;\n}\n\n// ============================================================\n// RENDER\n// ============================================================\nconst levelText = { easy: 'Dễ', medium: 'Trung bình', hard: 'Khó' };\nlet globalIdx = 0;\nconst allProblems = [];\n\nfunction renderProblem(item, container, isRtos) {\n  const idx = globalIdx++;\n  allProblems.push({ item, idx });\n\n  const div = document.createElement('div');\n  div.className = 'live-code' + (isRtos ? ' rtos-card' : '');\n  div.id = item.id;\n  div.innerHTML = `\n    <div class=\"q-title\">\n      <span class=\"num\">${idx + 1}<\/span>\n      ${item.title}\n      <span class=\"badge ${item.level}\">${levelText[item.level]}<\/span>\n      ${isRtos ? '<span class=\"badge rtos-tag\">RTOS<\/span>' : ''}\n    <\/div>\n    <p>${item.desc}<\/p>\n    <div class=\"example-box\">\n      <strong>Ví dụ / Yêu cầu:<\/strong><br>\n      ${item.example.replace(/\\n/g, '<br>')}\n    <\/div>\n    <button onclick=\"toggleSolution(${idx})\">Hiển thị đáp án<\/button>\n    <div class=\"solution\" id=\"sol-${idx}\">\n      <strong>Lời giải:<\/strong>\n      <pre class=\"code-solution\"><code>${highlightC(item.solution)}<\/code><\/pre>\n      <div class=\"explain-block\">\n        <strong>Giải thích chi tiết:<\/strong>\n        <p>${item.explain}<\/p>\n        <span class=\"complexity\">${item.complexity}<\/span>\n      <\/div>\n    <\/div>\n  `;\n  container.appendChild(div);\n}\n\npartA.forEach(p => renderProblem(p, document.getElementById('part-a'), false));\npartB.forEach(p => renderProblem(p, document.getElementById('part-b'), true));\n\nfunction toggleSolution(idx) {\n  const sol = document.getElementById(`sol-${idx}`);\n  const btn = sol.previousElementSibling;\n  if (sol.classList.contains('show')) {\n    sol.classList.remove('show');\n    btn.textContent = 'Hiển thị đáp án';\n  } else {\n    sol.classList.add('show');\n    btn.textContent = 'Ẩn đáp án';\n  }\n}\n\nlet allShown = false;\nfunction toggleAll() {\n  allShown = !allShown;\n  const btn = document.getElementById('btn-all');\n  allProblems.forEach(({ idx }) => {\n    const sol = document.getElementById(`sol-${idx}`);\n    const toggleBtn = sol.previousElementSibling;\n    if (allShown) {\n      sol.classList.add('show');\n      toggleBtn.textContent = 'Ẩn đáp án';\n    } else {\n      sol.classList.remove('show');\n      toggleBtn.textContent = 'Hiển thị đáp án';\n    }\n  });\n  btn.textContent = allShown ? 'Ẩn tất cả đáp án' : 'Hiển thị tất cả đáp án';\n}\n<\/script>\n<style>.nav-links{display:none!important}<\/style><script>document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\")||\"\";e.preventDefault();if(h.charAt(0)!==\"#\")return;var id=decodeURIComponent(h.slice(1)),t=id&&(document.getElementById(id)||document.getElementsByName(id)[0]);if(t)t.scrollIntoView({behavior:\"smooth\"});else window.scrollTo({top:0,behavior:\"smooth\"})});<\/script><\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Embedded Fresher - Trang 5 (20 bài LeetCode-style)<\/title>\n<style>\n  * { box-sizing: border-box; }\n  body {\n    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n    background: #eef1f5;\n    margin: 0;\n    padding: 20px;\n    color: #1a1a1a;\n    line-height: 1.6;\n  }\n  .container { max-width: 1000px; margin: 0 auto; }\n  h1 {\n    text-align: center;\n    color: #1a237e;\n    border-bottom: 3px solid #1a237e;\n    padding-bottom: 10px;\n  }\n  .subtitle {\n    text-align: center;\n    color: #555;\n    margin-bottom: 20px;\n    font-style: italic;\n  }\n  .stats {\n    text-align: center;\n    margin-bottom: 20px;\n  }\n  .badge {\n    display: inline-block;\n    padding: 4px 12px;\n    border-radius: 12px;\n    font-size: 0.85em;\n    font-weight: 600;\n    margin: 0 4px;\n  }\n  .badge.easy { background: #d4edda; color: #155724; }\n  .badge.medium { background: #fff3cd; color: #856404; }\n  .badge.hard { background: #f8d7da; color: #721c24; }\n\n  .live-code {\n    background: #ffffff;\n    border-radius: 10px;\n    padding: 22px;\n    margin-bottom: 25px;\n    box-shadow: 0 3px 10px rgba(0,0,0,0.08);\n    border-left: 5px solid #1a237e;\n  }\n  .q-title {\n    font-weight: bold;\n    margin-bottom: 8px;\n    color: #1a237e;\n    font-size: 1.15em;\n    display: flex;\n    align-items: center;\n    flex-wrap: wrap;\n    gap: 8px;\n  }\n  .q-title .num {\n    background: #1a237e;\n    color: #fff;\n    width: 32px;\n    height: 32px;\n    border-radius: 50%;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 0.9em;\n    flex-shrink: 0;\n  }\n  .live-code p { margin: 10px 0; }\n\n  .example-box {\n    background: #f5f7fa;\n    border-left: 4px solid #78909c;\n    padding: 10px 14px;\n    margin: 10px 0;\n    border-radius: 4px;\n    font-family: 'Consolas', 'Monaco', monospace;\n    font-size: 0.9em;\n  }\n  .example-box strong { color: #37474f; }\n\n  /* ==== CODE BLOCK — high contrast ==== */\n  pre {\n    margin: 0;\n    padding: 18px 20px;\n    border-radius: 8px;\n    overflow-x: auto;\n    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;\n    font-size: 0.92em;\n    line-height: 1.6;\n    tab-size: 4;\n  }\n  .code-solution {\n    background: #1e1e2e;\n    color: #e6e6e6;\n    border: 1px solid #313244;\n  }\n  .code-solution .c-key   { color: #89dceb; font-weight: 600; }\n  .code-solution .c-type  { color: #f9e2af; }\n  .code-solution .c-str   { color: #a6e3a1; }\n  .code-solution .c-num   { color: #fab387; }\n  .code-solution .c-com   { color: #7f849c; font-style: italic; }\n  .code-solution .c-func  { color: #cba6f7; }\n  .code-solution .c-pre   { color: #f38ba8; }\n\n  button {\n    background: #1a237e;\n    color: #fff;\n    border: none;\n    padding: 10px 22px;\n    border-radius: 6px;\n    cursor: pointer;\n    font-size: 1em;\n    margin-top: 12px;\n    margin-right: 8px;\n    transition: background 0.2s, transform 0.1s;\n    font-weight: 500;\n  }\n  button:hover { background: #283593; }\n  button:active { transform: scale(0.98); }\n\n  .btn-show-all {\n    display: block;\n    margin: 20px auto;\n    background: #2e7d32;\n    padding: 13px 34px;\n    font-size: 1.05em;\n  }\n  .btn-show-all:hover { background: #388e3c; }\n\n  .solution {\n    display: none;\n    margin-top: 18px;\n    padding: 20px;\n    background: #f1f8e9;\n    border-left: 5px solid #2e7d32;\n    border-radius: 6px;\n  }\n  .solution.show { display: block; }\n  .solution > strong {\n    display: block;\n    color: #1b5e20;\n    margin-bottom: 10px;\n    font-size: 1.05em;\n  }\n  .explain-block {\n    margin-top: 16px;\n    padding: 14px 18px;\n    background: #ffffff;\n    border-radius: 6px;\n    border-left: 4px solid #2e7d32;\n    color: #333;\n  }\n  .explain-block strong {\n    color: #1b5e20;\n    display: block;\n    margin-bottom: 6px;\n  }\n  .explain-block p { margin: 0 0 8px 0; }\n  .complexity {\n    display: inline-block;\n    background: #e8eaf6;\n    color: #1a237e;\n    padding: 4px 10px;\n    border-radius: 4px;\n    font-family: 'Consolas', monospace;\n    font-size: 0.88em;\n    margin-top: 6px;\n    font-weight: 600;\n  }\n\n  .nav-links { text-align: center; margin: 30px 0; }\n  .nav-links a {\n    display: inline-block;\n    padding: 10px 24px;\n    background: #1a237e;\n    color: #fff;\n    text-decoration: none;\n    border-radius: 6px;\n    margin: 5px;\n    transition: background 0.2s;\n  }\n  .nav-links a:hover { background: #283593; }\n\n  .toc {\n    background: #fff;\n    padding: 22px;\n    border-radius: 10px;\n    box-shadow: 0 3px 10px rgba(0,0,0,0.08);\n    margin-bottom: 25px;\n  }\n  .toc h3 {\n    margin-top: 0;\n    color
