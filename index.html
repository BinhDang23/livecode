: #1a237e;\n    border-bottom: 2px solid #e0e0e0;\n    padding-bottom: 10px;\n  }\n  .toc ol { margin: 0; padding-left: 22px; }\n  .toc li { padding: 5px 0; }\n  .toc a {\n    color: #1a237e;\n    text-decoration: none;\n    font-weight: 500;\n  }\n  .toc a:hover { text-decoration: underline; }\n  .toc .mini-badge {\n    font-size: 0.75em;\n    padding: 2px 8px;\n    border-radius: 8px;\n    margin-left: 6px;\n  }\n\n  .inline-code {\n    background: #e8eaf6;\n    color: #c62828;\n    padding: 2px 7px;\n    border-radius: 4px;\n    font-family: 'Consolas', 'Monaco', monospace;\n    font-size: 0.9em;\n    font-weight: 600;\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"container\">\n  <h1>Embedded Fresher — 20 bài Live Code LeetCode-style<\/h1>\n  <p class=\"subtitle\">Trang 5 — Luyện tư duy thuật toán cho phỏng vấn embedded (từ dễ đến trung bình)<\/p>\n\n  <div class=\"stats\">\n    <span class=\"badge easy\">🟢 Dễ: 8 bài<\/span>\n    <span class=\"badge medium\">🟡 Trung bình: 10 bài<\/span>\n    <span class=\"badge hard\">🔴 Khó: 2 bài<\/span>\n  <\/div>\n\n  <div class=\"toc\">\n    <h3>Mục lục 20 bài<\/h3>\n    <ol>\n      <li><a href=\"#p1\">Tính tổng các phần tử trong mảng<\/a> <span class=\"badge easy mini-badge\">Dễ<\/span><\/li>\n      <li><a href=\"#p2\">Tìm phần tử lớn nhất / nhỏ nhất<\/a> <span class=\"badge easy mini-badge\">Dễ<\/span><\/li>\n      <li><a href=\"#p3\">Đếm số chẵn/lẻ trong mảng<\/a> <span class=\"badge easy mini-badge\">Dễ<\/span><\/li>\n      <li><a href=\"#p4\">Tìm kiếm tuyến tính (linear search)<\/a> <span class=\"badge easy mini-badge\">Dễ<\/span><\/li>\n      <li><a href=\"#p5\">Đảo ngược mảng tại chỗ<\/a> <span class=\"badge easy mini-badge\">Dễ<\/span><\/li>\n      <li><a href=\"#p6\">Xóa phần tử trùng trong mảng sorted<\/a> <span class=\"badge easy mini-badge\">Dễ<\/span><\/li>\n      <li><a href=\"#p7\">Kiểm tra mảng đối xứng<\/a> <span class=\"badge easy mini-badge\">Dễ<\/span><\/li>\n      <li><a href=\"#p8\">Tính giai thừa (không đệ quy)<\/a> <span class=\"badge easy mini-badge\">Dễ<\/span><\/li>\n      <li><a href=\"#p9\">Fibonacci (tối ưu không gian)<\/a> <span class=\"badge medium mini-badge\">TB<\/span><\/li>\n      <li><a href=\"#p10\">Kiểm tra số hoàn hảo<\/a> <span class=\"badge medium mini-badge\">TB<\/span><\/li>\n      <li><a href=\"#p11\">Đếm số nguyên tố nhỏ hơn n (Sieve)<\/a> <span class=\"badge medium mini-badge\">TB<\/span><\/li>\n      <li><a href=\"#p12\">Tìm cặp số có tổng bằng target<\/a> <span class=\"badge medium mini-badge\">TB<\/span><\/li>\n      <li><a href=\"#p13\">Tìm dãy con liên tiếp có tổng lớn nhất (Kadane)<\/a> <span class=\"badge medium mini-badge\">TB<\/span><\/li>\n      <li><a href=\"#p14\">Đảo ngược số nguyên<\/a> <span class=\"badge medium mini-badge\">TB<\/span><\/li>\n      <li><a href=\"#p15\">Kiểm tra hai chuỗi Anagram<\/a> <span class=\"badge medium mini-badge\">TB<\/span><\/li>\n      <li><a href=\"#p16\">Loại bỏ ký tự trùng trong chuỗi<\/a> <span class=\"badge medium mini-badge\">TB<\/span><\/li>\n      <li><a href=\"#p17\">Tìm ký tự đầu tiên không lặp<\/a> <span class=\"badge medium mini-badge\">TB<\/span><\/li>\n      <li><a href=\"#p18\">Sắp xếp mảng 0/1/2 (Dutch flag)<\/a> <span class=\"badge medium mini-badge\">TB<\/span><\/li>\n      <li><a href=\"#p19\">Tìm phần tử majority (&gt;n/2)<\/a> <span class=\"badge hard mini-badge\">Khó<\/span><\/li>\n      <li><a href=\"#p20\">Binary search trên mảng sorted<\/a> <span class=\"badge hard mini-badge\">Khó<\/span><\/li>\n    <\/ol>\n  <\/div>\n\n  <button class=\"btn-show-all\" onclick=\"toggleAll()\" id=\"btn-all\">Hiển thị tất cả đáp án<\/button>\n\n  <div id=\"live-container\"><\/div>\n\n  <div class=\"nav-links\">\n    <a href=\"embedded-quiz-1.html\">← Trang 1<\/a>\n    <a href=\"embedded-quiz-2.html\">← Trang 2<\/a>\n    <a href=\"embedded-quiz-3.html\">← Trang 3<\/a>\n    <a href=\"embedded-quiz-4.html\">← Trang 4<\/a>\n  <\/div>\n<\/div>\n\n<script>\n// ============================================================\n// DỮ LIỆU 20 BÀI LEETCODE-STYLE\n// ============================================================\nconst problems = [\n{\n  id: \"p1\", level: \"easy\",\n  title: \"Tính tổng các phần tử trong mảng\",\n  desc: 'Viết hàm <span class=\"inline-code\">long sum_array(int *arr, int n)<\/span> trả về tổng các phần tử trong mảng.',\n  example: `Input:  arr = [1, 2, 3, 4, 5], n = 5\nOutput: 15`,\n  solution: `#include <stdio.h>\n\nlong sum_array(int *arr, int n) {\n    if (arr == NULL || n <= 0) return 0;\n    long sum = 0;\n    for (int i = 0; i < n; i++) {\n        sum += arr[i];\n    }\n    return sum;\n}\n\nint main() {\n    int a[] = {1, 2, 3, 4, 5};\n    printf(\"%ld\\\\n\", sum_array(a, 5));  // 15\n    return 0;\n}`,\n  explain: `- Duyệt mảng một lần, cộng dồn vào biến sum.\n- Dùng long để tránh tràn khi tổng vượt INT_MAX.\n- Kiểm tra NULL và n<=0 để an toàn.`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p2\", level: \"easy\",\n  title: \"Tìm phần tử lớn nhất / nhỏ nhất\",\n  desc: 'Viết hàm <span class=\"inline-code\">void min_max(int *arr, int n, int *min, int *max)<\/span> tìm min và max trong mảng bằng 1 lần duyệt.',\n  example: `Input:  arr = [3, 1, 4, 1, 5, 9, 2, 6], n = 8\nOutput: min = 1, max = 9`,\n  solution: `#include <stdio.h>\n\nvoid min_max(int *arr, int n, int *min, int *max) {\n    if (arr == NULL || n <= 0) return;\n    *min = *max = arr[0];\n    for (int i = 1; i < n; i++) {\n        if (arr[i] < *min) *min = arr[i];\n        if (arr[i] > *max) *max = arr[i];\n    }\n}\n\nint main() {\n    int a[] = {3, 1, 4, 1, 5, 9, 2, 6};\n    int mn, mx;\n    min_max(a, 8, &mn, &mx);\n    printf(\"min = %d, max = %d\\\\n\", mn, mx);  // 1, 9\n    return 0;\n}`,\n  explain: `- Khởi tạo min = max = arr[0].\n- Duyệt từ i=1, cập nhật min/max.\n- Chỉ 1 lần duyệt thay vì 2 lần → tối ưu.\n- Truyền con trỏ để trả về 2 giá trị.`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p3\", level: \"easy\",\n  title: \"Đếm số chẵn/lẻ trong mảng\",\n  desc: 'Viết hàm <span class=\"inline-code\">void count_even_odd(int *arr, int n, int *even, int *odd)<\/span> đếm số chẵn và số lẻ.',\n  example: `Input:  arr = [1, 2, 3, 4, 5, 6, 7], n = 7\nOutput: even = 3, odd = 4`,\n  solution: `#include <stdio.h>\n\nvoid count_even_odd(int *arr, int n, int *even, int *odd) {\n    *even = *odd = 0;\n    for (int i = 0; i < n; i++) {\n        if (arr[i] % 2 == 0) (*even)++;\n        else (*odd)++;\n    }\n}\n\nint main() {\n    int a[] = {1, 2, 3, 4, 5, 6, 7};\n    int e, o;\n    count_even_odd(a, 7, &e, &o);\n    printf(\"even = %d, odd = %d\\\\n\", e, o);  // 3, 4\n    return 0;\n}`,\n  explain: `- Dùng phép % 2 để kiểm tra chẵn/lẻ.\n- Tối ưu hơn: dùng bitwise AND (arr[i] & 1) vì nhanh hơn % trên nhiều MCU.\n- Truyền con trỏ để trả về 2 giá trị đếm.`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p4\", level: \"easy\",\n  title: \"Tìm kiếm tuyến tính (linear search)\",\n  desc: 'Viết hàm <span class=\"inline-code\">int linear_search(int *arr, int n, int target)<\/span> trả về chỉ số của target, hoặc -1 nếu không tìm thấy.',\n  example: `Input:  arr = [10, 20, 30, 40, 50], n = 5, target = 30\nOutput: 2\n\nInput:  arr = [10, 20, 30], n = 3, target = 99\nOutput: -1`,\n  solution: `#include <stdio.h>\n\nint linear_search(int *arr, int n, int target) {\n    for (int i = 0; i < n; i++) {\n        if (arr[i] == target) return i;\n    }\n    return -1;\n}\n\nint main() {\n    int a[] = {10, 20, 30, 40, 50};\n    printf(\"%d\\\\n\", linear_search(a, 5, 30));  // 2\n    printf(\"%d\\\\n\", linear_search(a, 5, 99));  // -1\n    return 0;\n}`,\n  explain: `- Duyệt từng phần tử, so sánh với target.\n- Nếu tìm thấy, trả về chỉ số ngay (early return).\n- Hết vòng lặp không tìm thấy → trả -1.\n- Độ phức tạp O(n), phù hợp mảng nhỏ.`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p5\", level: \"easy\",\n  title: \"Đảo ngược mảng tại chỗ\",\n  desc: 'Viết hàm <span class=\"inline-code\">void reverse_array(int *arr, int n)<\/span> đảo ngược mảng tại chỗ (không dùng mảng phụ).',\n  example: `Input:  arr = [1, 2, 3, 4, 5], n = 5\nOutput: arr = [5, 4, 3, 2, 1]`,\n  solution: `#include <stdio.h>\n\nvoid reverse_array(int *arr, int n) {\n    if (arr == NULL || n < 2) return;\n    int left = 0, right = n - 1;\n    while (left < right) {\n        int temp = arr[left];\n        arr[left] = arr[right];\n        arr[right] = temp;\n        left++;\n        right--;\n    }\n}\n\nint main() {\n    int a[] = {1, 2, 3, 4, 5};\n    reverse_array(a, 5);\n    for (int i = 0; i < 5; i++) printf(\"%d \", a[i]);  // 5 4 3 2 1\n    printf(\"\\\\n\");\n    return 0;\n}`,\n  explain: `- Dùng 2 chỉ số left/right tiến vào giữa.\n- Hoán đổi từng cặp, sau đó left++ và right--.\n- Điều kiện dừng: left >= right.\n- Không dùng bộ nhớ phụ → O(1) space.`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p6\", level: \"easy\",\n  title: \"Xóa phần tử trùng trong mảng sorted\",\n  desc: 'Cho mảng đã sắp xếp tăng dần, viết hàm <span class=\"inline-code\">int remove_duplicates(int *arr, int n)<\/span> trả về số phần tử còn lại sau khi loại bỏ trùng (in-place).',\n  example: `Input:  arr = [1, 1, 2, 2, 3, 4, 4], n = 7\nOutput: 4, arr = [1, 2, 3, 4, ...]`,\n  solution: `#include <stdio.h>\n\nint remove_duplicates(int *arr, int n) {\n    if (arr == NULL || n == 0) return 0;\n    int k = 1;  // vị trí ghi tiếp theo\n    for (int i = 1; i < n; i++) {\n        if (arr[i] != arr[k - 1]) {\n            arr[k] = arr[i];\n            k++;\n        }\n    }\n    return k;\n}\n\nint main() {\n    int a[] = {1, 1, 2, 2, 3, 4, 4};\n    int k = remove_duplicates(a, 7);\n    printf(\"k = %d, arr = \", k);\n    for (int i = 0; i < k; i++) printf(\"%d \", a[i]);\n    printf(\"\\\\n\");  // k = 4, arr = 1 2 3 4\n    return 0;\n}`,\n  explain: `- Dùng con trỏ k chỉ vị trí ghi tiếp theo trong mảng kết quả.\n- Duyệt i từ 1, so sánh arr[i] với arr[k-1] (phần tử cuối đã ghi).\n- Nếu khác, ghi arr[i] vào arr[k] và tăng k.\n- Kết quả là k phần tử đầu tiên của mảng gốc.`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p7\", level: \"easy\",\n  title: \"Kiểm tra mảng đối xứng\",\n  desc: 'Viết hàm <span class=\"inline-code\">int is_palindrome_array(int *arr, int n)<\/span> kiểm tra mảng có đối xứng (palindrome) không. Trả 1 nếu đúng.',\n  example: `Input:  arr = [1, 2, 3, 2, 1], n = 5  → Output: 1\nInput:  arr = [1, 2, 3, 4, 5], n = 5  → Output: 0`,\n  solution: `#include <stdio.h>\n\nint is_palindrome_array(int *arr, int n) {\n    if (arr == NULL || n < 0) return 0;\n    int left = 0, right = n - 1;\n    while (left < right) {\n        if (arr[left] != arr[right]) return 0;\n        left++;\n        right--;\n    }\n    return 1;\n}\n\nint main() {\n    int a[] = {1, 2, 3, 2, 1};\n    int b[] = {1, 2, 3, 4, 5};\n    printf(\"%d\\\\n\", is_palindrome_array(a, 5));  // 1\n    printf(\"%d\\\\n\", is_palindrome_array(b, 5));  // 0\n    return 0;\n}`,\n  explain: `- Dùng 2 con trỏ left/right tiến vào giữa.\n- Nếu arr[left] != arr[right] → không đối xứng, return 0.\n- Nếu duyệt hết mà không lỗi → đối xứng, return 1.\n- Mảng rỗng hoặc 1 phần tử → đối xứng.`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p8\", level: \"easy\",\n  title: \"Tính giai thừa (không đệ quy)\",\n  desc: 'Viết hàm <span class=\"inline-code\">unsigned long long factorial(int n)<\/span> tính n! không dùng đệ quy.',\n  example: `Input:  n = 5   → Output: 120\nInput:  n = 0   → Output: 1\nInput:  n = 10  → Output: 3628800`,\n  solution: `#include <stdio.h>\n\nunsigned long long factorial(int n) {\n    if (n < 0) return 0;      // không hợp lệ\n    unsigned long long result = 1;\n    for (int i = 2; i <= n; i++) {\n        result *= i;\n    }\n    return result;\n}\n\nint main() {\n    printf(\"%llu\\\\n\", factorial(5));   // 120\n    printf(\"%llu\\\\n\", factorial(0));   // 1\n    printf(\"%llu\\\\n\", factorial(10));  // 3628800\n    return 0;\n}`,\n  explain: `- Dùng vòng lặp thay đệ quy → không tốn stack.\n- 0! = 1 theo định nghĩa.\n- Dùng unsigned long long để chứa kết quả lớn (tối đa 20!).\n- Kiểm tra n < 0 trả 0 (không hợp lệ).`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p9\", level: \"medium\",\n  title: \"Fibonacci (tối ưu không gian)\",\n  desc: 'Viết hàm <span class=\"inline-code\">unsigned long long fib(int n)<\/span> tính số Fibonacci thứ n, chỉ dùng O(1) bộ nhớ.',\n  example: `Input:  n = 10  → Output: 55\nInput:  n = 0   → Output: 0\nInput:  n = 1   → Output: 1`,\n  solution: `#include <stdio.h>\n\nunsigned long long fib(int n) {\n    if (n < 0) return 0;\n    if (n < 2) return n;\n    unsigned long long a = 0, b = 1;\n    for (int i = 2; i <= n; i++) {\n        unsigned long long c = a + b;\n        a = b;\n        b = c;\n    }\n    return b;\n}\n\nint main() {\n    for (int i = 0; i <= 10; i++) {\n        printf(\"fib(%d) = %llu\\\\n\", i, fib(i));\n    }\n    return 0;\n}`,\n  explain: `- Cách đệ quy thông thường O(2^n) rất chậm.\n- Cách này dùng 2 biến a, b cuộn lại → O(n) time, O(1) space.\n- fib(0)=0, fib(1)=1, fib(n)=fib(n-1)+fib(n-2).\n- Có thể tối ưu hơn bằng ma trận lũy thừa O(log n).`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p10\", level: \"medium\",\n  title: \"Kiểm tra số hoàn hảo\",\n  desc: 'Số hoàn hảo là số có tổng các ước thực sự (không kể chính nó) bằng chính nó. Viết hàm kiểm tra.',\n  example: `Input:  n = 6   → Output: 1 (vì 1+2+3=6)\nInput:  n = 28  → Output: 1 (vì 1+2+4+7+14=28)\nInput:  n = 12  → Output: 0`,\n  solution: `#include <stdio.h>\n\nint is_perfect(int n) {\n    if (n <= 1) return 0;\n    int sum = 1;  // 1 luôn là ước\n    for (int i = 2; i * i <= n; i++) {\n        if (n % i == 0) {\n            sum += i;\n            if (i != n / i) sum += n / i;  // tránh cộng trùng khi i = sqrt(n)\n        }\n    }\n    return sum == n;\n}\n\nint main() {\n    printf(\"%d\\\\n\", is_perfect(6));   // 1\n    printf(\"%d\\\\n\", is_perfect(28));  // 1\n    printf(\"%d\\\\n\", is_perfect(12));  // 0\n    return 0;\n}`,\n  explain: `- Chỉ cần duyệt đến sqrt(n) → O(sqrt(n)).\n- Với mỗi ước i, cộng cả i và n/i (nếu khác).\n- Khởi tạo sum = 1 (1 luôn là ước thực sự).\n- Tránh cộng trùng khi i == n/i (số chính phương).`,\n  complexity: \"Time: O(√n) | Space: O(1)\"\n},\n{\n  id: \"p11\", level: \"medium\",\n  title: \"Đếm số nguyên tố nhỏ hơn n (Sieve of Eratosthenes)\",\n  desc: 'Viết hàm <span class=\"inline-code\">int count_primes(int n)<\/span> đếm số nguyên tố nhỏ hơn n bằng sàng Eratosthenes.',\n  example: `Input:  n = 10  → Output: 4 (2, 3, 5, 7)\nInput:  n = 20  → Output: 8 (2,3,5,7,11,13,17,19)`,\n  solution: `#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\nint count_primes(int n) {\n    if (n < 2) return 0;\n    char *is_prime = (char*)malloc(n);\n    if (is_prime == NULL) return -1;\n    memset(is_prime, 1, n);  // ban đầu giả sử tất cả là prime\n    is_prime[0] = is_prime[1] = 0;\n\n    for (int i = 2; i * i < n; i++) {\n        if (is_prime[i]) {\n            for (int j = i * i; j < n; j += i) {\n                is_prime[j] = 0;\n            }\n        }\n    }\n\n    int count = 0;\n    for (int i = 2; i < n; i++) {\n        if (is_prime[i]) count++;\n    }\n    free(is_prime);\n    return count;\n}\n\nint main() {\n    printf(\"%d\\\\n\", count_primes(10));  // 4\n    printf(\"%d\\\\n\", count_primes(20));  // 8\n    return 0;\n}`,\n  explain: `- Sàng Eratosthenes: bắt đầu từ 2, đánh dấu mọi bội của i là không nguyên tố.\n- Chỉ cần duyệt i đến sqrt(n).\n- Bắt đầu đánh dấu từ i*i (vì các bội nhỏ hơn đã bị đánh dấu bởi số nhỏ hơn).\n- Time O(n log log n) — rất nhanh.`,\n  complexity: \"Time: O(n log log n) | Space: O(n)\"\n},\n{\n  id: \"p12\", level: \"medium\",\n  title: \"Tìm cặp số có tổng bằng target\",\n  desc: 'Viết hàm <span class=\"inline-code\">int two_sum(int *arr, int n, int target, int *i_out, int *j_out)<\/span> tìm 2 chỉ số có tổng bằng target (giả sử mảng sorted).',\n  example: `Input:  arr = [1, 2, 3, 4, 6], target = 6\nOutput: i=1, j=3 (vì arr[1]+arr[3]=2+4=6)`,\n  solution: `#include <stdio.h>\n\nint two_sum(int *arr, int n, int target, int *i_out, int *j_out) {\n    int left = 0, right = n - 1;\n    while (left < right) {\n        int sum = arr[left] + arr[right];\n        if (sum == target) {\n            *i_out = left;\n            *j_out = right;\n            return 1;\n        } else if (sum < target) {\n            left++;\n        } else {\n            right--;\n        }\n    }\n    return 0;\n}\n\nint main() {\n    int a[] = {1, 2, 3, 4, 6};\n    int i, j;\n    if (two_sum(a, 5, 6, &i, &j)) {\n        printf(\"i=%d, j=%d\\\\n\", i, j);  // i=1, j=3\n    }\n    return 0;\n}`,\n  explain: `- Mảng đã sorted → dùng two-pointer.\n- Nếu tổng < target: cần tăng → left++.\n- Nếu tổng > target: cần giảm → right--.\n- Nếu bằng: trả về cặp chỉ số.\n- Cách ngây thơ O(n²); cách này O(n) — tối ưu.`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p13\", level: \"medium\",\n  title: \"Tìm dãy con liên tiếp có tổng lớn nhất (Kadane)\",\n  desc: 'Viết hàm <span class=\"inline-code\">int max_subarray_sum(int *arr, int n)<\/span> tìm tổng lớn nhất của dãy con liên tiếp.',\n  example: `Input:  arr = [-2, 1, -3, 4, -1, 2, 1, -5, 4]\nOutput: 6 (dãy [4, -1, 2, 1])`,\n  solution: `#include <stdio.h>\n#include <limits.h>\n\nint max_subarray_sum(int *arr, int n) {\n    if (arr == NULL || n == 0) return 0;\n    int max_so_far = arr[0];\n    int max_ending_here = arr[0];\n    for (int i = 1; i < n; i++) {\n        max_ending_here = (arr[i] > max_ending_here + arr[i])\n                          ? arr[i] : max_ending_here + arr[i];\n        if (max_ending_here > max_so_far) {\n            max_so_far = max_ending_here;\n        }\n    }\n    return max_so_far;\n}\n\nint main() {\n    int a[] = {-2, 1, -3, 4, -1, 2, 1, -5, 4};\n    printf(\"%d\\\\n\", max_subarray_sum(a, 9));  // 6\n    return 0;\n}`,\n  explain: `- Thuật toán Kadane: quét từng phần tử.\n- max_ending_here: tổng lớn nhất của dãy con kết thúc tại i.\n- Chọn max giữa arr[i] (bắt đầu lại) và max_ending_here + arr[i] (nối tiếp).\n- max_so_far theo dõi kết quả tốt nhất.\n- Time O(n), space O(1).`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p14\", level: \"medium\",\n  title: \"Đảo ngược số nguyên\",\n  desc: 'Viết hàm <span class=\"inline-code\">int reverse_int(int n)<\/span> đảo ngược các chữ số của số nguyên. Xử lý cả số âm.',\n  example: `Input:  n = 12345   → Output: 54321\nInput:  n = -1234   → Output: -4321\nInput:  n = 100     → Output: 1`,\n  solution: `#include <stdio.h>\n\nint reverse_int(int n) {\n    int reversed = 0;\n    while (n != 0) {\n        int digit = n % 10;\n        reversed = reversed * 10 + digit;\n        n /= 10;\n    }\n    return reversed;\n}\n\nint main() {\n    printf(\"%d\\\\n\", reverse_int(12345));   // 54321\n    printf(\"%d\\\\n\", reverse_int(-1234));   // -4321\n    printf(\"%d\\\\n\", reverse_int(100));     // 1\n    return 0;\n}`,\n  explain: `- Lấy chữ số cuối bằng n % 10.\n- Đẩy vào kết quả: reversed = reversed * 10 + digit.\n- Bỏ chữ số cuối: n /= 10.\n- Số âm vẫn hoạt động vì % giữ dấu trong C.\n- Lưu ý: cần kiểm tra overflow nếu đề yêu cầu.`,\n  complexity: \"Time: O(log n) | Space: O(1)\"\n},\n{\n  id: \"p15\", level: \"medium\",\n  title: \"Kiểm tra hai chuỗi Anagram\",\n  desc: 'Hai chuỗi là anagram nếu chúng có cùng tập ký tự (chỉ khác thứ tự). Viết hàm kiểm tra.',\n  example: `Input:  s1 = \"listen\", s2 = \"silent\"  → Output: 1\nInput:  s1 = \"hello\",  s2 = \"world\"   → Output: 0`,\n  solution: `#include <stdio.h>\n#include <string.h>\n\nint is_anagram(const char *s1, const char *s2) {\n    if (s1 == NULL || s2 == NULL) return 0;\n    if (strlen(s1) != strlen(s2)) return 0;\n\n    int count[256] = {0};\n    for (int i = 0; s1[i]; i++) {\n        count[(unsigned char)s1[i]]++;\n        count[(unsigned char)s2[i]]--;\n    }\n    for (int i = 0; i < 256; i++) {\n        if (count[i] != 0) return 0;\n    }\n    return 1;\n}\n\nint main() {\n    printf(\"%d\\\\n\", is_anagram(\"listen\", \"silent\"));  // 1\n    printf(\"%d\\\\n\", is_anagram(\"hello\", \"world\"));    // 0\n    return 0;\n}`,\n  explain: `- Đầu tiên so sánh độ dài, khác → không anagram.\n- Dùng mảng count[256] đếm tần suất.\n- Duyệt s1 thì ++count, duyệt s2 thì --count.\n- Nếu tất cả count[i] == 0 → anagram.\n- Time O(n), space O(1) (256 hằng số).`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p16\", level: \"medium\",\n  title: \"Loại bỏ ký tự trùng trong chuỗi\",\n  desc: 'Viết hàm <span class=\"inline-code\">void remove_dups(char *str)<\/span> loại bỏ ký tự trùng, giữ ký tự xuất hiện đầu tiên.',\n  example: `Input:  str = \"programming\"\nOutput: str = \"progamin\"`,\n  solution: `#include <stdio.h>\n\nvoid remove_dups(char *str) {\n    if (str == NULL) return;\n    int seen[256] = {0};\n    int k = 0;\n    for (int i = 0; str[i] != '\\\\0'; i++) {\n        unsigned char c = (unsigned char)str[i];\n        if (!seen[c]) {\n            seen[c] = 1;\n            str[k++] = str[i];\n        }\n    }\n    str[k] = '\\\\0';\n}\n\nint main() {\n    char s[] = \"programming\";\n    remove_dups(s);\n    printf(\"%s\\\\n\", s);  // progamin\n    return 0;\n}`,\n  explain: `- Dùng mảng seen[256] đánh dấu ký tự đã gặp.\n- k là vị trí ghi tiếp theo trong chuỗi kết quả.\n- Nếu ký tự chưa gặp: đánh dấu và ghi vào str[k++].\n- Cuối cùng thêm '\\\\0' kết thúc chuỗi.`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p17\", level: \"medium\",\n  title: \"Tìm ký tự đầu tiên không lặp\",\n  desc: 'Viết hàm <span class=\"inline-code\">char first_non_repeating(const char *str)<\/span> trả về ký tự đầu tiên không lặp lại. Trả \\'\\\\0\\' nếu không có.',\n  example: `Input:  str = \"swiss\"\nOutput: 'w' (s lặp, w chỉ xuất hiện 1 lần)\n\nInput:  str = \"aabbcc\"\nOutput: '\\\\0' (không có)`,\n  solution: `#include <stdio.h>\n\nchar first_non_repeating(const char *str) {\n    if (str == NULL) return '\\\\0';\n    int count[256] = {0};\n    for (int i = 0; str[i]; i++) {\n        count[(unsigned char)str[i]]++;\n    }\n    for (int i = 0; str[i]; i++) {\n        if (count[(unsigned char)str[i]] == 1) {\n            return str[i];\n        }\n    }\n    return '\\\\0';\n}\n\nint main() {\n    printf(\"%c\\\\n\", first_non_repeating(\"swiss\"));    // w\n    printf(\"%c\\\\n\", first_non_repeating(\"aabbcc\"));   // (null char)\n    return 0;\n}`,\n  explain: `- Duyệt lần 1: đếm tần suất từng ký tự vào count[256].\n- Duyệt lần 2: ký tự đầu tiên có count == 1 → trả về.\n- Nếu không có → trả '\\\\0'.\n- Time O(n), space O(1) (mảng 256 cố định).`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p18\", level: \"medium\",\n  title: \"Sắp xếp mảng 0/1/2 (Dutch National Flag)\",\n  desc: 'Cho mảng chỉ chứa 0, 1, 2. Sắp xếp tăng dần trong O(n), không đếm (không dùng counting sort).',\n  example: `Input:  arr = [2, 0, 2, 1, 1, 0]\nOutput: arr = [0, 0, 1, 1, 2, 2]`,\n  solution: `#include <stdio.h>\n\nvoid sort_012(int *arr, int n) {\n    int low = 0, mid = 0, high = n - 1;\n    while (mid <= high) {\n        if (arr[mid] == 0) {\n            int t = arr[low]; arr[low] = arr[mid]; arr[mid] = t;\n            low++; mid++;\n        } else if (arr[mid] == 1) {\n            mid++;\n        } else {  // arr[mid] == 2\n            int t = arr[mid]; arr[mid] = arr[high]; arr[high] = t;\n            high--;\n        }\n    }\n}\n\nint main() {\n    int a[] = {2, 0, 2, 1, 1, 0};\n    sort_012(a, 6);\n    for (int i = 0; i < 6; i++) printf(\"%d \", a[i]);  // 0 0 1 1 2 2\n    printf(\"\\\\n\");\n    return 0;\n}`,\n  explain: `- Thuật toán Dutch National Flag của Dijkstra.\n- 3 con trỏ: low (biên 0), mid (đang xét), high (biên 2).\n- arr[mid]==0: swap với low, low++, mid++.\n- arr[mid]==1: mid++.\n- arr[mid]==2: swap với high, high-- (không tăng mid).\n- Time O(n), space O(1), chỉ 1 lần duyệt.`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p19\", level: \"hard\",\n  title: \"Tìm phần tử majority (>n/2)\",\n  desc: 'Tìm phần tử xuất hiện nhiều hơn n/2 lần trong mảng (giả sử luôn tồn tại). Dùng thuật toán Boyer-Moore.',\n  example: `Input:  arr = [3, 2, 3]\nOutput: 3\n\nInput:  arr = [2, 2, 1, 1, 1, 2, 2]\nOutput: 2`,\n  solution: `#include <stdio.h>\n\nint majority_element(int *arr, int n) {\n    // Bước 1: tìm candidate\n    int candidate = arr[0];\n    int count = 1;\n    for (int i = 1; i < n; i++) {\n        if (arr[i] == candidate) {\n            count++;\n        } else {\n            count--;\n            if (count == 0) {\n                candidate = arr[i];\n                count = 1;\n            }\n        }\n    }\n    // Bước 2 (nếu không đảm bảo tồn tại): verify\n    int verify = 0;\n    for (int i = 0; i < n; i++) {\n        if (arr[i] == candidate) verify++;\n    }\n    return (verify > n / 2) ? candidate : -1;\n}\n\nint main() {\n    int a[] = {2, 2, 1, 1, 1, 2, 2};\n    printf(\"%d\\\\n\", majority_element(a, 7));  // 2\n    return 0;\n}`,\n  explain: `- Thuật toán Boyer-Moore Voting: O(n) time, O(1) space.\n- Ý tưởng: nếu 1 phần tử chiếm > n/2, nó không thể bị \"triệt tiêu\" hết.\n- Bước 1: tìm candidate bằng cách \"khử\" các cặp khác nhau.\n- Bước 2: verify candidate thực sự > n/2 (nếu đề không đảm bảo).\n- Không dùng hash map → tiết kiệm bộ nhớ.`,\n  complexity: \"Time: O(n) | Space: O(1)\"\n},\n{\n  id: \"p20\", level: \"hard\",\n  title: \"Binary search trên mảng sorted\",\n  desc: 'Viết hàm <span class=\"inline-code\">int binary_search(int *arr, int n, int target)<\/span> tìm target trong mảng đã sorted. Trả chỉ số hoặc -1.',\n  example: `Input:  arr = [1, 3, 5, 7, 9, 11, 13], target = 7\nOutput: 3\n\nInput:  arr = [1, 3, 5, 7], target = 6\nOutput: -1`,\n  solution: `#include <stdio.h>\n\nint binary_search(int *arr, int n, int target) {\n    int left = 0, right = n - 1;\n    while (left <= right) {\n        // Tránh overflow: mid = left + (right - left) / 2\n        int mid = left + (right - left) / 2;\n        if (arr[mid] == target) {\n            return mid;\n        } else if (arr[mid] < target) {\n            left = mid + 1;\n        } else {\n            right = mid - 1;\n        }\n    }\n    return -1;\n}\n\nint main() {\n    int a[] = {1, 3, 5, 7, 9, 11, 13};\n    printf(\"%d\\\\n\", binary_search(a, 7, 7));   // 3\n    printf(\"%d\\\\n\", binary_search(a, 7, 6));   // -1\n    return 0;\n}`,\n  explain: `- Mảng đã sorted → binary search O(log n).\n- mid = left + (right - left) / 2 để tránh overflow (left+right có thể vượt INT_MAX).\n- Nếu arr[mid] < target: tìm bên phải.\n- Nếu arr[mid] > target: tìm bên trái.\n- Điều kiện dừng: left > right → không tìm thấy.`,\n  complexity: \"Time: O(log n) | Space: O(1)\"\n}\n];\n\n// ============================================================\n// SYNTAX HIGHLIGHTING\n// ============================================================\nfunction highlightC(code) {\n  let s = code\n    .replace(/&/g, '&amp;')\n    .replace(/<\/g, '&lt;')\n    .replace(/>/g, '&gt;');\n\n  const placeholders = [];\n  let phIndex = 0;\n\n  s = s.replace(/\\/\\/[^\\n]*/g, (m) => {\n    placeholders.push(`<span class=\"c-com\">${m}<\/span>`);\n    return `\\u0000${phIndex++}\\u0000`;\n  });\n  s = s.replace(/\\/\\*[\\s\\S]*?\\*\\//g, (m) => {\n    placeholders.push(`<span class=\"c-com\">${m}<\/span>`);\n    return `\\u0000${phIndex++}\\u0000`;\n  });\n  s = s.replace(/\"(?:\\\\.|[^\"\\\\])*\"/g, (m) => {\n    placeholders.push(`<span class=\"c-str\">${m}<\/span>`);\n    return `\\u0000${phIndex++}\\u0000`;\n  });\n  s = s.replace(/'(?:\\\\.|[^'\\\\])*'/g, (m) => {\n    placeholders.push(`<span class=\"c-str\">${m}<\/span>`);\n    return `\\u0000${phIndex++}\\u0000`;\n  });\n  s = s.replace(/^(\\s*)(#\\w+)/gm, (m, sp, dir) => {\n    return `${sp}<span class=\"c-pre\">${dir}<\/span>`;\n  });\n\n  const keywords = ['int','char','void','long','short','unsigned','signed','float','double',\n    'if','else','for','while','do','switch','case','break','continue','return','goto',\n    'struct','union','enum','typedef','sizeof','const','static','extern','volatile','register',\n    'inline','NULL','true','false','bool','uint8_t','uint16_t','uint32_t','int8_t','int16_t','int32_t',\n    'unsigned long long'];\n  keywords.forEach(kw => {\n    const re = new RegExp(`\\\\b${kw.replace(/ /g, '\\\\s+')}\\\\b`, 'g');\n    s = s.replace(re, `<span class=\"c-key\">${kw}<\/span>`);\n  });\n\n  s = s.replace(/\\b(0x[0-9A-Fa-f]+|\\d+)\\b/g, '<span class=\"c-num\">$1<\/span>');\n\n  s = s.replace(/\\u0000(\\d+)\\u0000/g, (m, i) => placeholders[parseInt(i)]);\n  return s;\n}\n\n// ============================================================\n// RENDER\n// ============================================================\nconst container = document.getElementById('live-container');\nconst levelText = { easy: 'Dễ', medium: 'Trung bình', hard: 'Khó' };\n\nproblems.forEach((item, idx) => {\n  const div = document.createElement('div');\n  div.className = 'live-code';\n  div.id = item.id;\n  div.innerHTML = `\n    <div class=\"q-title\">\n      <span class=\"num\">${idx + 1}<\/span>\n      ${item.title}\n      <span class=\"badge ${item.level}\">${levelText[item.level]}<\/span>\n    <\/div>\n    <p>${item.desc}<\/p>\n    <div class=\"example-box\">\n      <strong>Ví dụ:<\/strong><br>\n      ${item.example.replace(/\\n/g, '<br>')}\n    <\/div>\n    <button onclick=\"toggleSolution(${idx})\">Hiển thị đáp án<\/button>\n    <div class=\"solution\" id=\"sol-${idx}\">\n      <strong>Lời giải:<\/strong>\n      <pre class=\"code-solution\"><code>${highlightC(item.solution)}<\/code><\/pre>\n      <div class=\"explain-block\">\n        <strong>Giải thích chi tiết:<\/strong>\n        <p>${item.explain}<\/p>\n        <span class=\"complexity\">${item.complexity}<\/span>\n      <\/div>\n    <\/div>\n  `;\n  container.appendChild(div);\n});\n\nfunction toggleSolution(idx) {\n  const sol = document.getElementById(`sol-${idx}`);\n  const btn = sol.previousElementSibling;\n  if (sol.classList.contains('show')) {\n    sol.classList.remove('show');\n    btn.textContent = 'Hiển thị đáp án';\n  } else {\n    sol.classList.add('show');\n    btn.textContent = 'Ẩn đáp án';\n  }\n}\n\nlet allShown = false;\nfunction toggleAll() {\n  allShown = !allShown;\n  const btn = document.getElementById('btn-all');\n  problems.forEach((item, idx) => {\n    const sol = document.getElementById(`sol-${idx}`);\n    const toggleBtn = sol.previousElementSibling;\n    if (allShown) {\n      sol.classList.add('show');\n      toggleBtn.textContent = 'Ẩn đáp án';\n    } else {\n      sol.classList.remove('show');\n      toggleBtn.textContent = 'Hiển thị đáp án';\n    }\n  });\n  btn.textContent = allShown ? 'Ẩn tất cả đáp án' : 'Hiển thị tất cả đáp án';\n}\n<\/script>\n<style>.nav-links{display:none!important}<\/style><script>document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\")||\"\";e.preventDefault();if(h.charAt(0)!==\"#\")return;var id=decodeURIComponent(h.slice(1)),t=id&&(document.getElementById(id)||document.getElementsByName(id)[0]);if(t)t.scrollIntoView({behavior:\"smooth\"});else window.scrollTo({top:0,behavior:\"smooth\"})});<\/script><\/body>\n<\/html>"];
